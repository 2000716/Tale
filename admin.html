<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tale – Admin Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070b1e; color: white; padding: 2rem; min-height: 100vh; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    header { margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; }
    h1 { color: #AEC2F7; font-size: 1.8rem; }
    p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-top: 0.2rem; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: #0b112c; padding: 1.5rem; border-radius: 12px; border: 1px solid #1e293b; }
    .card.full-width { grid-column: 1 / -1; }
    h3 { margin-bottom: 1rem; color: #e2e8f0; font-size: 1.1rem; border-bottom: 1px solid #1a2342; padding-bottom: 0.5rem; }
    
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-top: 0.8rem; margin-bottom: 0.2rem; }
    input, select, textarea { width: 100%; padding: 0.8rem; background: #070b1e; border: 1px solid #1e293b; color: white; border-radius: 6px; font-size: 0.9rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #AEC2F7; }
    
    button { background: #AEC2F7; color: #0b112c; padding: 0.8rem 1.2rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; width: 100%; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    
    .btn-delete { background: #ef4444; color: white; padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto; margin-top: 0; }
    .btn-delete:hover { background: #dc2626; }
    
    .section-list-item { display: flex; justify-content: space-between; align-items: center; background: #131b3e; padding: 1rem; border-radius: 8px; margin-bottom: 0.8rem; border: 1px solid #1e293b; }
    .status-msg { font-size: 0.85rem; color: #38bdf8; margin-top: 0.5rem; text-align: center; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; background: #1e293b; border-radius: 4px; font-size: 0.75rem; color: #AEC2F7; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Tale Admin Panel</h1>
      <p class="subtitle">Oversikt over kategorier, innhold og RSS-strømmer for Lydbøker, Podkaster og Radio</p>
    </header>

    <div class="grid">
      <!-- 1. OPPRETT KATEGORI / SEKSJON -->
      <div class="card">
        <h3>1. Opprett Kategori / Seksjon</h3>
        <form id="add-section-form">
          <label>Navn på Seksjon</label>
          <input type="text" id="sec-title" placeholder="f.eks. NRK Podkaster eller Topp Lydbøker" required>
          
          <label>Plasser på side</label>
          <select id="sec-page">
            <option value="home">Hjem-skjerm</option>
            <option value="audiobooks">Lydbøker</option>
            <option value="podcasts">Podkaster</option>
            <option value="radio">Radio (Direkte)</option>
          </select>

          <label>Rekkefølge (Tall)</label>
          <input type="number" id="sec-order" value="1" required>

          <button type="submit">Opprett Seksjon</button>
        </form>
      </div>

      <!-- 2. LEGG TIL INNHOLD ELLER RSS-STRØM -->
      <div class="card">
        <h3>2. Legg til Innhold / RSS</h3>
        <form id="add-item-form">
          <label>Velg Seksjon</label>
          <select id="item-section-select" required>
            <option value="">Laster seksjoner...</option>
          </select>

          <label>Tittel</label>
          <input type="text" id="item-title" placeholder="Tittel på kanal, serie eller bok" required>

          <label>Undertittel / Kategori / Utgiver</label>
          <input type="text" id="item-sub" placeholder="f.eks. NRK P3, Krim, Jo Nesbø" required>

          <label>RSS Feed URL (for Podkast/Radio-strøm)</label>
          <input type="url" id="item-rss" placeholder="https://eksempel.no/rss-feed.xml">

          <label>Emoji / Ikon Cover</label>
          <input type="text" id="item-icon" placeholder="📖, 🎙️ eller 📻" value="📖">

          <label>Beskrivelse</label>
          <textarea id="item-desc" placeholder="Kort om innholdet..." rows="2"></textarea>

          <button type="submit" id="save-btn">Lagre Innhold</button>
          <div id="status-msg" class="status-msg"></div>
        </form>
      </div>

      <!-- 3. OVERSIKT OVER ALLE SEKSJONER OG INNHOLD -->
      <div class="card full-width">
        <h3>Eksisterende Seksjoner i Firebase</h3>
        <div id="sections-list">Laster inn...</div>
      </div>
    </div>
  </div>

  <!-- FIREBASE INTEGRASJON -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      deleteDoc, 
      updateDoc, 
      arrayUnion, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfJ3IXqeJUkCVcMnPt3ya37Co7Du-f1WU",
      authDomain: "tale-8cadc.firebaseapp.com",
      projectId: "tale-8cadc",
      storageBucket: "tale-8cadc.firebasestorage.app",
      messagingSenderId: "326781333063",
      appId: "1:326781333063:web:c7303967acf8ea79184b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const sectionsSelect = document.getElementById("item-section-select");
    const sectionsList = document.getElementById("sections-list");
    const statusMsg = document.getElementById("status-msg");

    // 1. Hent og vis alle seksjoner i sanntid
    const q = query(collection(db, "sections"), orderBy("order", "asc"));
    onSnapshot(q, (snapshot) => {
      sectionsSelect.innerHTML = '<option value="">-- Velg Seksjon --</option>';
      sectionsList.innerHTML = '';

      if (snapshot.empty) {
        sectionsList.innerHTML = '<p style="color: #94a3b8;">Ingen seksjoner opprettet ennå.</p>';
      }

      snapshot.forEach((docSnap) => {
        const sec = docSnap.data();
        const id = docSnap.id;

        // Oppdater Dropdown
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = `${sec.title} (${sec.page})`;
        sectionsSelect.appendChild(opt);

        // Vis i oversikten
        const item = document.createElement("div");
        item.className = "section-list-item";
        
        let itemsCount = sec.items ? sec.items.length : 0;
        
        item.innerHTML = `
          <div>
            <span class="badge">${sec.page}</span>
            <strong style="margin-left: 0.5rem; font-size: 1.1rem;">${sec.title}</strong>
            <br><small style="color: #94a3b8; display: inline-block; margin-top: 0.3rem;">Elementer: ${itemsCount} | Rekkefølge: ${sec.order}</small>
          </div>
          <button class="btn-delete" onclick="deleteSection('${id}')">Slett Seksjon</button>
        `;
        sectionsList.appendChild(item);
      });
    });

    // 2. Opprett ny seksjon
    document.getElementById("add-section-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("sec-title").value;
      const page = document.getElementById("sec-page").value;
      const order = parseInt(document.getElementById("sec-order").value);

      try {
        await addDoc(collection(db, "sections"), {
          title,
          page,
          order,
          items: []
        });
        document.getElementById("sec-title").value = '';
      } catch (err) {
        alert("Feil ved opprettelse: " + err.message);
      }
    });

    // 3. Legg til innhold/RSS
    document.getElementById("add-item-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sectionId = sectionsSelect.value;
      if (!sectionId) return alert("Vennligst velg en seksjon først!");

      statusMsg.innerText = "Lagrer...";

      try {
        const title = document.getElementById("item-title").value;
        const sub = document.getElementById("item-sub").value;
        const rssUrl = document.getElementById("item-rss").value;
        const icon = document.getElementById("item-icon").value;
        const desc = document.getElementById("item-desc").value;

        const sectionRef = doc(db, "sections", sectionId);
        await updateDoc(sectionRef, {
          items: arrayUnion({
            title,
            sub,
            rssUrl: rssUrl || "",
            icon,
            desc
          })
        });

        statusMsg.innerText = "Innholdet ble lagret!";
        document.getElementById("add-item-form").reset();
      } catch (err) {
        statusMsg.innerText = "Feil ved lagring: " + err.message;
      } finally {
        setTimeout(() => statusMsg.innerText = "", 3000);
      }
    });

    // Slett seksjon
    window.deleteSection = async (id) => {
      if (confirm("Er du sikker på at du vil slette denne seksjonen?")) {
        await deleteDoc(doc(db, "sections", id));
      }
    };
  </script>
</body>
</html>
