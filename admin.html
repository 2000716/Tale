<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tale – Admin Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; background: #070b1e; color: white; height: 100vh; overflow: hidden; }
    
    /* Venstre side: Kontrollpanel */
    .admin-controls { width: 50%; padding: 2rem; overflow-y: auto; border-right: 2px solid #1e293b; }
    h1 { margin-bottom: 0.5rem; color: #AEC2F7; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    
    .card { background: #0b112c; padding: 1.5rem; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 1.5rem; }
    h3 { margin-bottom: 1rem; color: #e2e8f0; font-size: 1.1rem; }
    
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-top: 0.8rem; margin-bottom: 0.2rem; }
    input, select, textarea { width: 100%; padding: 0.8rem; background: #070b1e; border: 1px solid #1e293b; color: white; border-radius: 6px; font-size: 0.9rem; }
    input[type="file"] { padding: 0.5rem; background: #131b3e; cursor: pointer; }
    
    button { background: #AEC2F7; color: #0b112c; padding: 0.8rem 1.2rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; width: 100%; transition: background 0.2s; }
    button:hover { background: #93acfc; }
    button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    
    .btn-delete { background: #ef4444; color: white; padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto; margin-top: 0; }
    .btn-delete:hover { background: #dc2626; }
    
    .section-list-item { display: flex; justify-content: space-between; align-items: center; background: #131b3e; padding: 0.8rem 1rem; border-radius: 6px; margin-bottom: 0.5rem; border: 1px solid #1e293b; }
    .status-msg { font-size: 0.85rem; color: #38bdf8; margin-top: 0.5rem; text-align: center; }

    /* Høyre side: Live Preview */
    .preview-container { width: 50%; display: flex; justify-content: center; align-items: center; background: #03050f; position: relative; }
    .phone-mockup { width: 380px; height: 750px; border: 12px solid #1e293b; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); background: #070b1e; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- VENSTRE: KONTROLLPANEL -->
  <div class="admin-controls">
    <h1>Tale CMS Studio</h1>
    <p class="subtitle">Administrer seksjoner, kort og filopplastinger til Firebase</p>

    <!-- 1. Opprett ny Seksjon -->
    <div class="card">
      <h3>1. Legg til ny Seksjon / Karusell</h3>
      <form id="add-section-form">
        <label>Seksjonsnavn</label>
        <input type="text" id="sec-title" placeholder="f.eks. Topp 10 Lydbøker" required>
        
        <label>Plasser på side</label>
        <select id="sec-page">
          <option value="home">Hjem</option>
          <option value="audiobooks">Lydbøker</option>
          <option value="podcasts">Podkaster</option>
          <option value="radio">Radio</option>
        </select>

        <label>Rekkefølge (Tall)</label>
        <input type="number" id="sec-order" value="1" required>

        <button type="submit">Opprett Seksjon</button>
      </form>
    </div>

    <!-- 2. Legg til Innhold i Seksjon -->
    <div class="card">
      <h3>2. Legg til Innhold og Filer</h3>
      <form id="add-item-form">
        <label>Velg Seksjon</label>
        <select id="item-section-select" required>
          <option value="">Laster seksjoner...</option>
        </select>

        <label>Tittel</label>
        <input type="text" id="item-title" placeholder="Tittel på lydbok/podkast" required>

        <label>Undertittel / Kategori / Forfatter</label>
        <input type="text" id="item-sub" placeholder="f.eks. Jo Nesbø eller NRK" required>

        <label>Emoji / Ikon (Vises om bilde mangler)</label>
        <input type="text" id="item-icon" placeholder="📖, 🎙️ eller 📻" value="📖">

        <label>Omslagsbilde (Valgfritt - Firebase Storage)</label>
        <input type="file" id="item-cover-file" accept="image/*">

        <label>Lydfil / Audio (Valgfritt - Firebase Storage)</label>
        <input type="file" id="item-audio-file" accept="audio/*">

        <label>Beskrivelse</label>
        <textarea id="item-desc" placeholder="Kort om innholdet..." rows="3"></textarea>

        <button type="submit" id="upload-btn">Last opp og Legg til Innhold</button>
        <div id="upload-status" class="status-msg"></div>
      </form>
    </div>

    <!-- 3. Eksisterende Seksjoner -->
    <div class="card">
      <h3>Eksisterende Seksjoner</h3>
      <div id="sections-list">Laster inn...</div>
    </div>
  </div>

  <!-- HØYRE: LIVE MOBIL PREVIEW -->
  <div class="preview-container">
    <div class="phone-mockup">
      <iframe id="preview-iframe" src="index.html"></iframe>
    </div>
  </div>

  <!-- FIREBASE INTEGRASJON -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      deleteDoc, 
      updateDoc, 
      arrayUnion, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Firebase Konfigurasjon
    const firebaseConfig = {
      apiKey: "AIzaSyDfJ3IXqeJUkCVcMnPt3ya37Co7Du-f1WU",
      authDomain: "tale-8cadc.firebaseapp.com",
      projectId: "tale-8cadc",
      storageBucket: "tale-8cadc.firebasestorage.app",
      messagingSenderId: "326781333063",
      appId: "1:326781333063:web:c7303967acf8ea79184b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const sectionsSelect = document.getElementById("item-section-select");
    const sectionsList = document.getElementById("sections-list");
    const uploadStatus = document.getElementById("upload-status");
    const uploadBtn = document.getElementById("upload-btn");
    const previewIframe = document.getElementById("preview-iframe");

    // 1. Hent og vis eksisterende seksjoner
    const q = query(collection(db, "sections"), orderBy("order", "asc"));
    onSnapshot(q, (snapshot) => {
      sectionsSelect.innerHTML = '<option value="">-- Velg Seksjon --</option>';
      sectionsList.innerHTML = '';

      snapshot.forEach((docSnap) => {
        const sec = docSnap.data();
        const id = docSnap.id;

        // Oppdater Dropdown Menu
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = `${sec.title} (${sec.page})`;
        sectionsSelect.appendChild(opt);

        // Oppdater Liste over seksjoner
        const item = document.createElement("div");
        item.className = "section-list-item";
        item.innerHTML = `
          <div>
            <strong>${sec.title}</strong> <small>(${sec.page})</small>
            <br><small style="color: #94a3b8;">Elementer: ${sec.items ? sec.items.length : 0}</small>
          </div>
          <button class="btn-delete" onclick="deleteSection('${id}')">Slett</button>
        `;
        sectionsList.appendChild(item);
      });

      // Oppdater live preview
      if (previewIframe.contentWindow) {
        previewIframe.contentWindow.location.reload();
      }
    });

    // 2. Opprett Seksjon
    document.getElementById("add-section-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("sec-title").value;
      const page = document.getElementById("sec-page").value;
      const order = parseInt(document.getElementById("sec-order").value);

      try {
        await addDoc(collection(db, "sections"), {
          title,
          page,
          order,
          items: []
        });
        document.getElementById("sec-title").value = '';
      } catch (err) {
        alert("Kunne ikke opprette seksjon: " + err.message);
      }
    });

    // 3. Legg til innhold med filopplasting til Storage
    document.getElementById("add-item-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sectionId = sectionsSelect.value;
      if (!sectionId) return alert("Velg en seksjon først!");

      uploadBtn.disabled = true;
      uploadStatus.innerText = "Laster opp filer til Firebase...";

      try {
        const title = document.getElementById("item-title").value;
        const sub = document.getElementById("item-sub").value;
        const icon = document.getElementById("item-icon").value;
        const desc = document.getElementById("item-desc").value;

        const coverFile = document.getElementById("item-cover-file").files[0];
        const audioFile = document.getElementById("item-audio-file").files[0];

        let coverUrl = "";
        let audioUrl = "";

        // Last opp bilde til Storage dersom det er valgt
        if (coverFile) {
          const coverRef = ref(storage, `covers/${Date.now()}_${coverFile.name}`);
          await uploadBytes(coverRef, coverFile);
          coverUrl = await getDownloadURL(coverRef);
        }

        // Last opp lydfil til Storage dersom det er valgt
        if (audioFile) {
          const audioRef = ref(storage, `audio/${Date.now()}_${audioFile.name}`);
          await uploadBytes(audioRef, audioFile);
          audioUrl = await getDownloadURL(audioRef);
        }

        // Oppdater Firestore med det nye innholdet
        const sectionRef = doc(db, "sections", sectionId);
        await updateDoc(sectionRef, {
          items: arrayUnion({
            title,
            sub,
            icon,
            desc,
            coverUrl,
            audioUrl
          })
        });

        uploadStatus.innerText = "Innhold ble lagt til!";
        document.getElementById("add-item-form").reset();
      } catch (err) {
        uploadStatus.innerText = "Feil ved opplasting: " + err.message;
      } finally {
        uploadBtn.disabled = false;
        setTimeout(() => uploadStatus.innerText = "", 3000);
      }
    });

    // Global slettefunksjon for seksjoner
    window.deleteSection = async (id) => {
      if (confirm("Er du sikker på at du vil slette denne seksjonen?")) {
        await deleteDoc(doc(db, "sections", id));
      }
    };
  </script>
</body>
</html>
