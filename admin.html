<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tale – Visual App Builder & Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070a12; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; }

    /* Top Navigation Header */
    header.admin-header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand-title { font-size: 1.1rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem; }
    
    .nav-tabs { display: flex; gap: 0.5rem; background: #020617; padding: 0.25rem; border-radius: 8px; border: 1px solid #1e293b; }
    .tab-btn { background: transparent; color: #94a3b8; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #0284c7; color: #ffffff; }

    /* Login Screen */
    #login-card { max-width: 380px; margin: 5rem auto; background: #0f172a; padding: 2rem; border-radius: 12px; border: 1px solid #1e293b; width: 100%; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.35rem; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 0.65rem 0.8rem; background: #020617; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; font-size: 0.875rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    button { background: #0284c7; color: #ffffff; padding: 0.65rem 1rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }

    .hidden { display: none !important; }

    /* Builder Layout (3 Columns / Wix style) */
    .builder-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Left Sidebar: Components Drawer */
    .sidebar-drawer {
      width: 280px;
      background: #0f172a;
      border-right: 1px solid #1e293b;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    .drawer-title { font-size: 0.85rem; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 0.05em; }
    
    .component-btn {
      background: #020617;
      border: 1px solid #334155;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      color: #e2e8f0;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s;
    }
    .component-btn:hover { border-color: #38bdf8; background: #1e293b; color: #38bdf8; transform: translateY(-2px); }

    /* Center Area: App Live Canvas / Simulator */
    .canvas-container {
      flex: 1;
      background: #020617;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
    }
    
    /* Phone / Screen Frame */
    .app-screen-frame {
      width: 100%;
      max-width: 420px;
      min-height: 700px;
      background: #0b112c;
      border: 2px solid #1e293b;
      border-radius: 24px;
      padding: 1.2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
    }

    .canvas-dropzone {
      min-height: 600px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Rendered Dragged Blocks on Canvas */
    .canvas-block {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 0.8rem;
      transition: all 0.2s;
    }
    .canvas-block:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
    
    .block-controls {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 0.3rem;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .canvas-block:hover .block-controls { opacity: 1; }
    .btn-ctrl { background: #1e293b; color: white; border: none; padding: 0.2rem 0.5rem; font-size: 0.7rem; border-radius: 4px; cursor: pointer; }
    .btn-ctrl.delete { background: #dc2626; }

    /* Right Sidebar: Settings for Selected Element */
    .settings-drawer {
      width: 320px;
      background: #0f172a;
      border-left: 1px solid #1e293b;
      padding: 1.2rem;
      overflow-y: auto;
    }

    /* Dummy preview items */
    .dummy-grid { display: grid; gap: 0.5rem; }
    .dummy-grid.g-2 { grid-template-columns: repeat(2, 1fr); }
    .dummy-grid.g-3 { grid-template-columns: repeat(3, 1fr); }
    .dummy-grid.g-4 { grid-template-columns: repeat(4, 1fr); }
    .dummy-box { background: #1e293b; aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #64748b; }
    .dummy-banner { width: 100%; height: 100px; background: linear-gradient(135deg, #0284c7, #3b82f6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* Search & Content Tab */
    .content-panel { max-width: 1000px; margin: 2rem auto; width: 100%; padding: 0 1rem; }
    .api-results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .api-card { background: #0f172a; border: 1px solid #1e293b; padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; }
    .api-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <!-- ADMIN HEADER -->
  <header class="admin-header">
    <div class="brand-title">Tale Studio Builder</div>
    
    <div id="nav-tabs" class="nav-tabs hidden">
      <button class="tab-btn active" onclick="switchTab('builder')"> Visuell Sidebygger</button>
      <button class="tab-btn" onclick="switchTab('content')"> Innholdsdatabase & API</button>
    </div>

    <button id="logout-btn" class="hidden" style="background:#334155; padding:0.4rem 0.8rem; font-size:0.8rem;">Logg ut</button>
  </header>

  <!-- INNLOGGING -->
  <div id="login-card">
    <h3 style="margin-bottom: 1rem;">Admin Innlogging</h3>
    <form id="login-form">
      <div class="form-group">
        <label>E-post</label>
        <input type="email" id="login-email" placeholder="admin@tale.no" required>
      </div>
      <div class="form-group">
        <label>Passord</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" style="width: 100%;">Åpne Studio</button>
      <div id="login-msg" style="color: #ef4444; font-size: 0.8rem; margin-top: 0.5rem;"></div>
    </form>
  </div>

  <!-- TAB 1: VISUELL SIDEBYGGER (WIX-STYLE) -->
  <div id="tab-builder" class="builder-layout hidden">
    
    <!-- VENSTRE: BLOKKER / MODULER -->
    <div class="sidebar-drawer">
      <div class="drawer-title">Legg til Moduler</div>
      
      <button class="component-btn" onclick="addBlockToCanvas('header')">
        <span> Tittel / Overskrift</span>
      </button>

      <button class="component-btn" onclick="addBlockToCanvas('search')">
        <span> Søkefelt</span>
      </button>

      <button class="component-btn" onclick="addBlockToCanvas('banner')">
        <span> Stort Banner / Hero</span>
      </button>

      <button class="component-btn" onclick="addBlockToCanvas('grid-2')">
        <span> 2 Kolonner (Galleri)</span>
      </button>

      <button class="component-btn" onclick="addBlockToCanvas('grid-3')">
        <span> 3 Kolonner (Standard)</span>
      </button>

      <button class="component-btn" onclick="addBlockToCanvas('grid-4')">
        <span> 4 Kolonner (Kompakt)</span>
      </button>

      <button class="component-btn" onclick="addBlockToCanvas('spacer')">
        <span> Tomrom / Spacer</span>
      </button>
    </div>

    <!-- MIDTEN: LIVE SKJERM SIMULATOR (CANVAS) -->
    <div class="canvas-container">
      <div class="app-screen-frame">
        <div style="font-size: 0.75rem; color: #64748b; text-align: center; margin-bottom: 0.5rem;">
           Live Forhåndsvisning (Hjem-skjerm)
        </div>
        
        <div id="canvas-dropzone" class="canvas-dropzone">
          <!-- Moduler blir lagt til dynamisk her -->
        </div>
      </div>
    </div>

    <!-- HØYRE: PROPERTIES / INNSTILLINGER -->
    <div class="settings-drawer">
      <div class="drawer-title" style="margin-bottom: 1rem;">Modul-innstillinger</div>
      <div id="settings-content" style="color: #64748b; font-size: 0.85rem;">
        Klikk på en modul i midten for å redigere farger, kobling og tekst.
      </div>
      
      <button id="save-layout-btn" style="margin-top: 2rem; width: 100%; background: #10b981;">
         Publiser Layout til Appen
      </button>
    </div>
  </div>

  <!-- TAB 2: INNHOLDSDATABASE (PODKAST / BØKER) -->
  <div id="tab-content" class="content-panel hidden">
    <div style="background: #0f172a; padding: 1.5rem; border-radius: 12px; border: 1px solid #1e293b;">
      <h3>Søk og Legg til Innhold (Apple API)</h3>
      <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <input type="text" id="api-search-input" placeholder="Søk etter podkast eller tittel...">
        <button id="api-search-btn" style="width: auto;">Søk</button>
      </div>
      <div id="api-results" class="api-results-grid"></div>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfJ3IXqeJUkCVcMnPt3ya37Co7Du-f1WU",
      authDomain: "tale-8cadc.firebaseapp.com",
      projectId: "tale-8cadc",
      storageBucket: "tale-8cadc.firebasestorage.app",
      messagingSenderId: "326781333063",
      appId: "1:326781333063:web:c7303967acf8ea79184b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let activeLayout = [];
    let selectedBlockIndex = null;

    // Autentisering
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("login-card").classList.add("hidden");
        document.getElementById("nav-tabs").classList.remove("hidden");
        document.getElementById("logout-btn").classList.remove("hidden");
        switchTab('builder');
        loadLayoutFromFirebase();
      } else {
        document.getElementById("login-card").classList.remove("hidden");
        document.getElementById("tab-builder").classList.add("hidden");
        document.getElementById("tab-content").classList.add("hidden");
        document.getElementById("nav-tabs").classList.add("hidden");
        document.getElementById("logout-btn").classList.add("hidden");
      }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("login-email").value, document.getElementById("login-password").value);
      } catch (err) {
        document.getElementById("login-msg").innerText = "Feil passord eller e-post.";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    // Skifte faner
    window.switchTab = (tab) => {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById("tab-builder").classList.add("hidden");
      document.getElementById("tab-content").classList.add("hidden");

      if (tab === 'builder') {
        document.getElementById("tab-builder").classList.remove("hidden");
        event.target.classList.add('active');
      } else {
        document.getElementById("tab-content").classList.remove("hidden");
        event.target.classList.add('active');
      }
    };

    // --- VISUELL BYGGE-LOGIKK (CANVAS) ---

    window.addBlockToCanvas = (type) => {
      const newBlock = {
        id: 'block_' + Date.now(),
        type: type,
        title: type === 'header' ? 'Ny Overskrift' : 'Seksjonstittel',
        layout: type.startsWith('grid') ? type : 'standard'
      };
      activeLayout.push(newBlock);
      renderCanvas();
    };

    window.removeBlock = (index) => {
      activeLayout.splice(index, 1);
      renderCanvas();
      document.getElementById("settings-content").innerHTML = "Modul slettet.";
    };

    window.moveBlock = (index, direction) => {
      if (direction === -1 && index > 0) {
        const temp = activeLayout[index];
        activeLayout[index] = activeLayout[index - 1];
        activeLayout[index - 1] = temp;
      } else if (direction === 1 && index < activeLayout.length - 1) {
        const temp = activeLayout[index];
        activeLayout[index] = activeLayout[index + 1];
        activeLayout[index + 1] = temp;
      }
      renderCanvas();
    };

    window.selectBlock = (index) => {
      selectedBlockIndex = index;
      const block = activeLayout[index];
      const settings = document.getElementById("settings-content");

      settings.innerHTML = `
        <div class="form-group">
          <label>Tittel / Tekst</label>
          <input type="text" value="${block.title || ''}" oninput="updateBlockTitle(${index}, this.value)">
        </div>
        <div class="form-group">
          <label>Modultype</label>
          <input type="text" value="${block.type}" disabled style="opacity: 0.6;">
        </div>
      `;
    };

    window.updateBlockTitle = (index, val) => {
      activeLayout[index].title = val;
      renderCanvas();
    };

    function renderCanvas() {
      const zone = document.getElementById("canvas-dropzone");
      zone.innerHTML = "";

      if (activeLayout.length === 0) {
        zone.innerHTML = `<div style="text-align:center; padding: 3rem 0; color:#475569; font-size: 0.85rem;">Canvas er tomt.<br>Trykk på knappene til venstre for å bygge.</div>`;
        return;
      }

      activeLayout.forEach((block, index) => {
        const el = document.createElement("div");
        el.className = "canvas-block";
        el.onclick = () => selectBlock(index);

        let content = '';
        if (block.type === 'header') {
          content = `<h3 style="color:#ffffff;">${block.title}</h3>`;
        } else if (block.type === 'search') {
          content = `<div style="background:#1e293b; padding:0.5rem; border-radius:8px; color:#64748b; font-size:0.8rem;">🔍 Søk etter lydbøker, podkaster...</div>`;
        } else if (block.type === 'banner') {
          content = `<div class="dummy-banner">${block.title}</div>`;
        } else if (block.type.startsWith('grid')) {
          const cols = block.type.split('-')[1];
          content = `
            <div style="font-weight:bold; margin-bottom:0.4rem; font-size:0.85rem; color:#38bdf8;">${block.title} (${cols} kolonner)</div>
            <div class="dummy-grid g-${cols}">
              ${'<div class="dummy-box">Bilde</div>'.repeat(parseInt(cols))}
            </div>
          `;
        } else if (block.type === 'spacer') {
          content = `<div style="text-align:center; color:#475569; font-size:0.7rem;">--- Tomrom / Avstand ---</div>`;
        }

        el.innerHTML = `
          <div class="block-controls">
            <button class="btn-ctrl" onclick="event.stopPropagation(); moveBlock(${index}, -1)">▲</button>
            <button class="btn-ctrl" onclick="event.stopPropagation(); moveBlock(${index}, 1)">▼</button>
            <button class="btn-ctrl delete" onclick="event.stopPropagation(); removeBlock(${index})">✕</button>
          </div>
          ${content}
        `;
        zone.appendChild(el);
      });
    }

    // Lagre layout til Firebase Firestore
    document.getElementById("save-layout-btn").addEventListener("click", async () => {
      try {
        await setDoc(doc(db, "app_config", "home_layout"), { blocks: activeLayout });
        alert("Suksess! Ny layout er publisert til appen.");
      } catch (e) {
        alert("Feil ved lagring: " + e.message);
      }
    });

    async function loadLayoutFromFirebase() {
      const snap = await getDoc(doc(db, "app_config", "home_layout"));
      if (snap.exists() && snap.data().blocks) {
        activeLayout = snap.data().blocks;
        renderCanvas();
      }
    }

    // --- APPLE API SØK (INNHOLD) ---
    document.getElementById("api-search-btn").addEventListener("click", async () => {
      const term = document.getElementById("api-search-input").value;
      if (!term) return;
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=podcast&country=NO&limit=8`);
      const data = await res.json();
      
      const grid = document.getElementById("api-results");
      grid.innerHTML = "";
      (data.results || []).forEach(pod => {
        grid.innerHTML += `
          <div class="api-card">
            <img src="${pod.artworkUrl600}">
            <strong>${pod.collectionName}</strong>
            <p style="color:#64748b; font-size:0.75rem;">${pod.artistName}</p>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
