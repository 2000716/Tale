<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tale Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131b2e;
      --bg-input: #080c14;
      --border: #1e293b;
      --border-light: #334155;
      --accent: #38bdf8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --success-hover: #059669;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Layout Framework */
    .app-header {
      background: rgba(19, 27, 46, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    
    .brand-title { display: flex; align-items: center; gap: 0.75rem; }
    .brand-title h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .brand-title .badge-tag { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    
    .container { max-width: 1400px; margin: 0 auto; width: 100%; padding: 2rem; }

    /* Auth Card */
    .auth-container { max-width: 400px; margin: 5rem auto; width: 100%; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    
    /* Grid System */
    .dashboard-grid { display: grid; grid-template-columns: 380px 1fr; gap: 2rem; align-items: start; }
    @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .card-header { margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
    .card-header h3 { color: #fff; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }

    /* Inputs & Forms */
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select, textarea {
      width: 100%; padding: 0.7rem 0.9rem; background: var(--bg-input); border: 1px solid var(--border-light);
      color: var(--text-main); border-radius: 6px; font-size: 0.875rem; transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

    /* Custom Checkbox Group */
    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; background: var(--bg-input); padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-light); }
    .checkbox-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.825rem; color: #cbd5e1; cursor: pointer; user-select: none; }
    .checkbox-item input { width: auto; cursor: pointer; accent-color: var(--primary); }

    /* Buttons */
    .btn { background: var(--primary); color: #fff; padding: 0.7rem 1.2rem; border: none; border-radius: 6px; font-weight: 600; font-size: 0.875rem; cursor: pointer; width: 100%; transition: all 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 0.5rem; }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { background: #1e293b; color: var(--text-main); width: auto; border: 1px solid var(--border-light); }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: var(--danger); width: auto; padding: 0.4rem 0.8rem; font-size: 0.75rem; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-edit { background: #334155; width: auto; padding: 0.4rem 0.8rem; font-size: 0.75rem; }
    .btn-edit:hover { background: #475569; }

    /* API Search Box */
    .api-box { background: rgba(2, 132, 199, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 8px; padding: 1rem; margin-bottom: 1.25rem; }
    .api-search-row { display: flex; gap: 0.5rem; }
    .api-search-row input { flex: 1; }
    .api-search-row button { width: auto; white-space: nowrap; }

    .api-results-container { max-height: 240px; overflow-y: auto; margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 4px; }
    .api-result-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.8rem; border: 1px solid var(--border); }
    .api-result-left { display: flex; align-items: center; gap: 0.75rem; overflow: hidden; }
    .api-result-left img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .api-result-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; width: auto; border-radius: 4px; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: var(--success-hover); }

    /* Sections List Display */
    .search-filter-bar { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .search-filter-bar input { background: var(--bg-card); }

    .section-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; transition: border-color 0.2s; }
    .section-card:hover { border-color: var(--border-light); }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    
    .tag-badge { display: inline-block; padding: 0.15rem 0.5rem; background: #1e293b; border-radius: 4px; font-size: 0.68rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-right: 0.25rem; }
    .type-badge { display: inline-block; padding: 0.1rem 0.4rem; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 4px; font-size: 0.65rem; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-left: 0.4rem; }

    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
    .item-card { display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); padding: 0.6rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); }
    .item-info { display: flex; align-items: center; gap: 0.75rem; overflow: hidden; }
    .item-thumbnail { width: 40px; height: 40px; background: #1e293b; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    
    .status-msg { font-size: 0.85rem; color: var(--accent); margin-top: 0.75rem; text-align: center; min-height: 1.2rem; font-weight: 500; }
    .hidden { display: none !important; }

    /* Modals for Edit */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 500px; padding: 1.5rem; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-input); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header class="app-header">
    <div class="brand-title">
      <h1>Tale Admin</h1>
      <span class="badge-tag">v2.0 Realtime</span>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <span id="user-display" style="font-size: 0.85rem; color: var(--text-muted);"></span>
      <button id="logout-btn" class="btn btn-secondary hidden">Logg ut</button>
    </div>
  </header>

  <div class="container">

    <!-- LOGIN SCREEN -->
    <div id="login-card" class="auth-container">
      <div class="auth-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <h2 style="font-size: 1.4rem;">Velkommen</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Logg inn for å behandle Tale app-innhold</p>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label>E-postadresse</label>
            <input type="email" id="login-email" placeholder="admin@tale.no" required>
          </div>
          <div class="form-group">
            <label>Passord</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn">Logg inn</button>
          <div id="login-msg" class="status-msg"></div>
        </form>
      </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="admin-content" class="dashboard-grid hidden">
      
      <!-- LEFT COLUMN: CREATION CONTROLS -->
      <div>
        
        <!-- 1. CREATION PANEL -->
        <div class="card">
          <div class="card-header">
            <h3>Ny Seksjon</h3>
          </div>
          <form id="add-section-form">
            <div class="form-group">
              <label>Seksjonsnavn</label>
              <input type="text" id="sec-title" placeholder="f.eks. Populære Radiokanaler" required>
            </div>
            
            <div class="form-group">
              <label>Vis på sider</label>
              <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" value="home" class="sec-target-pages" checked> Hjem</label>
                <label class="checkbox-item"><input type="checkbox" value="audiobooks" class="sec-target-pages"> Lydbøker</label>
                <label class="checkbox-item"><input type="checkbox" value="podcasts" class="sec-target-pages"> Podkaster</label>
                <label class="checkbox-item"><input type="checkbox" value="radio" class="sec-target-pages"> Radio</label>
              </div>
            </div>

            <div class="form-group">
              <label>Rekkefølge / Prioritet</label>
              <input type="number" id="sec-order" value="1" required>
            </div>

            <button type="submit" class="btn">Opprett Seksjon</button>
          </form>
        </div>

        <!-- 2. ADD CONTENT PANEL -->
        <div class="card">
          <div class="card-header">
            <h3>Legg til Innhold</h3>
          </div>
          
          <div class="form-group">
            <label>Innholdstype</label>
            <select id="content-type-select">
              <option value="podcast">Podkast (Apple API Search / RSS)</option>
              <option value="radio">Radio Stream (MP3 / AAC / HLS Direct URL)</option>
              <option value="audiobook">Lydbok (Direkte MP3 / Lydfil URL)</option>
            </select>
          </div>

          <!-- iTunes Search API (Kun for Podkast) -->
          <div id="podcast-search-box" class="api-box">
            <label style="color: var(--accent);">Søk Apple Podkaster</label>
            <div class="api-search-row" style="margin-top: 0.4rem;">
              <input type="text" id="api-search-input" placeholder="Søk f.eks. 'NRK'">
              <button type="button" id="api-search-btn" class="btn btn-secondary">Søk</button>
            </div>
            <div id="api-results" class="api-results-container"></div>
            
            <div id="selected-queue" class="hidden" style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border-light); display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 0.8rem;">Kø: <strong id="queue-count" style="color: var(--accent);">0</strong> elementer</span>
              <button type="button" id="batch-publish-btn" class="btn btn-sm btn-success">Publiser alle i kø</button>
            </div>
          </div>

          <!-- Direct Entry Form -->
          <form id="add-item-form">
            <div class="form-group">
              <label>Målseksjon</label>
              <select id="item-section-select" required>
                <option value="">Laster seksjoner...</option>
              </select>
            </div>

            <div class="form-group">
              <label>Tittel</label>
              <input type="text" id="item-title" placeholder="f.eks. NRK P3" required>
            </div>

            <div class="form-group">
              <label>Undertittel / Opphavseier</label>
              <input type="text" id="item-sub" placeholder="f.eks. NRK / Ungdom & Musikk" required>
            </div>

            <div class="form-group">
              <label>Bilde URL (Cover / Logo)</label>
              <input type="url" id="item-cover" placeholder="https://domain.com/logo.jpg">
            </div>

            <div class="form-group">
              <label id="url-label-text">RSS Feed URL</label>
              <input type="url" id="item-url" placeholder="https://domain.com/feed.xml" required>
            </div>

            <div class="form-group">
              <label>Beskrivelse</label>
              <textarea id="item-desc" rows="2" placeholder="Kort sammendrag..."></textarea>
            </div>

            <button type="submit" class="btn">Publiser Enkeltinnhold</button>
            <div id="status-msg" class="status-msg"></div>
          </form>
        </div>

      </div>

      <!-- RIGHT COLUMN: CONTENT & SECTIONS MANAGEMENT -->
      <div>
        <div class="search-filter-bar">
          <input type="text" id="filter-sections-input" placeholder="Søk i eksisterende seksjoner eller media...">
        </div>

        <div id="sections-list">
          <div style="text-align: center; color: var(--text-muted); padding: 3rem;">Laster inn databasen...</div>
        </div>
      </div>

    </div>
  </div>

  <!-- EDIT SECTION MODAL -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="card-header">
        <h3>Rediger Seksjon</h3>
        <button type="button" onclick="closeEditModal()" class="btn btn-secondary btn-sm">X</button>
      </div>
      <form id="edit-section-form">
        <input type="hidden" id="edit-sec-id">
        <div class="form-group">
          <label>Seksjonsnavn</label>
          <input type="text" id="edit-sec-title" required>
        </div>
        <div class="form-group">
          <label>Vis på sider</label>
          <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" value="home" class="edit-sec-target-pages"> Hjem</label>
            <label class="checkbox-item"><input type="checkbox" value="audiobooks" class="edit-sec-target-pages"> Lydbøker</label>
            <label class="checkbox-item"><input type="checkbox" value="podcasts" class="edit-sec-target-pages"> Podkaster</label>
            <label class="checkbox-item"><input type="checkbox" value="radio" class="edit-sec-target-pages"> Radio</label>
          </div>
        </div>
        <div class="form-group">
          <label>Rekkefølge / Prioritet</label>
          <input type="number" id="edit-sec-order" required>
        </div>
        <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" onclick="closeEditModal()" class="btn btn-secondary">Avbryt</button>
          <button type="submit" class="btn">Lagre Endringer</button>
        </div>
      </form>
    </div>
  </div>

<!-- FIREBASE ENGINE & APP LOGIC -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDoc, query, orderBy 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { 
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDfJ3IXqeJUkCVcMnPt3ya37Co7Du-f1WU",
    authDomain: "tale-8cadc.firebaseapp.com",
    projectId: "tale-8cadc",
    storageBucket: "tale-8cadc.firebasestorage.app",
    messagingSenderId: "326781333063",
    appId: "1:326781333063:web:c7303967acf8ea79184b62"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const loginCard = document.getElementById("login-card");
  const adminContent = document.getElementById("admin-content");
  const loginMsg = document.getElementById("login-msg");
  const logoutBtn = document.getElementById("logout-btn");
  const userDisplay = document.getElementById("user-display");

  let queueItems = [];
  let rawSectionsData = [];

  // Authentication State Listener
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginCard.classList.add("hidden");
      adminContent.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      userDisplay.innerText = user.email;
      loadDatabaseContent();
    } else {
      loginCard.classList.remove("hidden");
      adminContent.classList.add("hidden");
      logoutBtn.classList.add("hidden");
      userDisplay.innerText = "";
    }
  });

  // Login Handler
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await signInWithEmailAndPassword(auth, document.getElementById("login-email").value, document.getElementById("login-password").value);
      loginMsg.innerText = "";
    } catch (err) {
      loginMsg.innerText = "Feil ved innlogging: " + err.message;
    }
  });

  logoutBtn.addEventListener("click", () => signOut(auth));

  // Dynamic Form Labels based on Content Type Choice
  document.getElementById("content-type-select").addEventListener("change", (e) => {
    const type = e.target.value;
    const podcastBox = document.getElementById("podcast-search-box");
    const urlLabel = document.getElementById("url-label-text");
    const mediaInput = document.getElementById("item-url");

    if (type === "podcast") {
      podcastBox.classList.remove("hidden");
      urlLabel.innerText = "RSS Feed URL";
      mediaInput.placeholder = "https://eksempel.no/feed.xml";
    } else if (type === "audiobook") {
      podcastBox.classList.add("hidden");
      urlLabel.innerText = "Lydfil Stream URL (MP3/M4B)";
      mediaInput.placeholder = "https://eksempel.no/audiobook.mp3";
    } else if (type === "radio") {
      podcastBox.classList.add("hidden");
      urlLabel.innerText = "Radio Stream URL (Direkte MP3 / AAC / M3U8)";
      mediaInput.placeholder = "https://lyd.nrk.no/nrk_radio_p3_aac_h";
    }
  });

  // iTunes Search Functionality
  let searchResultsCache = [];
  document.getElementById("api-search-btn").addEventListener("click", async () => {
    const term = document.getElementById("api-search-input").value.trim();
    const resultsContainer = document.getElementById("api-results");
    if (!term) return alert("Skriv inn et søkeord.");

    resultsContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem 0;">Søker hos Apple...</div>';

    try {
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=podcast&country=NO&limit=20`);
      const data = await res.json();
      searchResultsCache = data.results || [];
      resultsContainer.innerHTML = '';

      if (searchResultsCache.length === 0) {
        resultsContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem;">Ingen treff funnet.</div>';
        return;
      }

      searchResultsCache.forEach((pod, index) => {
        const row = document.createElement("div");
        row.className = "api-result-item";
        row.innerHTML = `
          <div class="api-result-left">
            <img src="${pod.artworkUrl100 || ''}" alt="">
            <div class="api-result-text">
              <strong>${pod.collectionName}</strong>
              <div style="color: var(--text-muted); font-size: 0.7rem;">${pod.artistName || 'Ukjent'}</div>
            </div>
          </div>
          <div style="display: flex; gap: 0.3rem;">
            <button type="button" class="btn btn-sm btn-secondary" onclick="fillFormFromApi(${index})">Fyll Ut</button>
            <button type="button" class="btn btn-sm" style="background: var(--primary);" onclick="addToQueue(${index}, this)">+ Kø</button>
          </div>
        `;
        resultsContainer.appendChild(row);
      });
    } catch (err) {
      resultsContainer.innerHTML = '<div style="color: var(--danger); font-size: 0.8rem;">Feil: ' + err.message + '</div>';
    }
  });

  window.fillFormFromApi = (index) => {
    const pod = searchResultsCache[index];
    if (!pod) return;

    document.getElementById("item-title").value = pod.collectionName || "";
    document.getElementById("item-sub").value = pod.artistName || pod.primaryGenreName || "";
    document.getElementById("item-cover").value = pod.artworkUrl600 || pod.artworkUrl100 || "";
    document.getElementById("item-url").value = pod.feedUrl || "";
    document.getElementById("item-desc").value = `Podkast hentet fra Apple. Sjanger: ${pod.primaryGenreName || 'Diverse'}.`;

    const statusMsg = document.getElementById("status-msg");
    statusMsg.innerText = `Skjema fylt ut med "${pod.collectionName}". Velg målseksjon og trykk Publiser!`;
    setTimeout(() => statusMsg.innerText = "", 4000);
  };

  window.addToQueue = (index, btnElement) => {
    const pod = searchResultsCache[index];
    if (!pod) return;

    queueItems.push({
      type: "podcast",
      title: pod.collectionName || "",
      sub: pod.artistName || pod.primaryGenreName || "",
      coverUrl: pod.artworkUrl600 || pod.artworkUrl100 || "",
      mediaUrl: pod.feedUrl || "",
      desc: `Podkast hentet fra Apple. Sjanger: ${pod.primaryGenreName || 'Diverse'}.`
    });

    btnElement.innerText = "Lagt til";
    btnElement.disabled = true;
    btnElement.style.opacity = "0.5";

    document.getElementById("selected-queue").classList.remove("hidden");
    document.getElementById("queue-count").innerText = queueItems.length;
  };

  document.getElementById("batch-publish-btn").addEventListener("click", async () => {
    const sectionId = document.getElementById("item-section-select").value;
    if (!sectionId) return alert("Du må velge en målseksjon før du publiserer køen!");

    try {
      const sectionRef = doc(db, "sections", sectionId);
      const docSnap = await getDoc(sectionRef);
      
      if (docSnap.exists()) {
        const currentItems = docSnap.data().items || [];
        await updateDoc(sectionRef, { items: [...currentItems, ...queueItems] });
        
        alert(`${queueItems.length} elementer ble vellykket lagt til!`);
        queueItems = [];
        document.getElementById("selected-queue").classList.add("hidden");
        document.getElementById("queue-count").innerText = "0";
      }
    } catch (err) {
      alert("Feil under lagring: " + err.message);
    }
  });

  // Database Realtime Load
  function loadDatabaseContent() {
    const q = query(collection(db, "sections"), orderBy("order", "asc"));
    onSnapshot(q, (snapshot) => {
      rawSectionsData = [];
      snapshot.forEach((docSnap) => {
        rawSectionsData.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderSectionsUI();
    });
  }

  function renderSectionsUI() {
    const sectionsSelect = document.getElementById("item-section-select");
    const sectionsList = document.getElementById("sections-list");
    const filterText = document.getElementById("filter-sections-input").value.toLowerCase();

    sectionsSelect.innerHTML = '<option value="">-- Velg Seksjon --</option>';
    sectionsList.innerHTML = '';

    const filtered = rawSectionsData.filter(sec => {
      const matchTitle = sec.title.toLowerCase().includes(filterText);
      const matchItems = sec.items && sec.items.some(i => i.title.toLowerCase().includes(filterText));
      return matchTitle || matchItems;
    });

    if (filtered.length === 0) {
      sectionsList.innerHTML = '<div class="card" style="text-align: center; color: var(--text-muted);">Ingen seksjoner eller innhold samsvarer med søket.</div>';
      return;
    }

    filtered.forEach((sec) => {
      const pages = Array.isArray(sec.pages) ? sec.pages : [sec.page || 'home'];

      // Populate Select Input
      const opt = document.createElement("option");
      opt.value = sec.id;
      opt.textContent = `[${pages.join(", ").toUpperCase()}] ${sec.title}`;
      sectionsSelect.appendChild(opt);

      // Build Dashboard Cards
      const secCard = document.createElement("div");
      secCard.className = "section-card";

      let itemsHtml = "";
      if (sec.items && sec.items.length > 0) {
        itemsHtml = `<div class="item-grid">` + sec.items.map((item, index) => {
          // FIKSET: Radio må ikke falle tilbake på RSS-podcast
          const itemType = item.type || (item.mediaUrl && item.mediaUrl.includes('.xml') ? 'podcast' : 'radio');
          return `
          <div class="item-card">
            <div class="item-info">
              ${item.coverUrl ? `<img src="${item.coverUrl}" class="item-thumbnail" alt="Cover">` : `<div class="item-thumbnail"></div>`}
              <div style="overflow: hidden;">
                <strong style="font-size: 0.85rem; display: flex; align-items: center; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                  ${item.title}
                  <span class="type-badge">${itemType}</span>
                </strong>
                <div style="color: var(--text-muted); font-size: 0.75rem;">${item.sub || ''}</div>
              </div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteItem('${sec.id}', ${index})">Slett</button>
          </div>
        `}).join("") + `</div>`;
      } else {
        itemsHtml = `<div style="color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem 0;">Ingen innholdselementer tilknyttet denne seksjonen enda.</div>`;
      }

      const badgesHtml = pages.map(p => `<span class="tag-badge">${p}</span>`).join("");

      secCard.innerHTML = `
        <div class="section-header">
          <div>
            ${badgesHtml}
            <strong style="margin-left: 0.5rem; font-size: 1.05rem;">${sec.title}</strong>
            <span style="color: var(--text-muted); font-size: 0.8rem; margin-left: 0.5rem;">(Prioritet: ${sec.order})</span>
          </div>
          <div style="display: flex; gap: 0.4rem;">
            <button class="btn btn-edit" onclick="openEditModal('${sec.id}')">Rediger</button>
            <button class="btn btn-danger" onclick="deleteSection('${sec.id}')">Slett Seksjon</button>
          </div>
        </div>
        ${itemsHtml}
      `;
      sectionsList.appendChild(secCard);
    });
  }

  document.getElementById("filter-sections-input").addEventListener("input", renderSectionsUI);

  // Section Creation
  document.getElementById("add-section-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("sec-title").value;
    const order = parseInt(document.getElementById("sec-order").value);
    const selectedPages = Array.from(document.querySelectorAll('.sec-target-pages:checked')).map(cb => cb.value);

    if (selectedPages.length === 0) return alert("Velg minst én side hvor seksjonen skal vises.");

    try {
      await addDoc(collection(db, "sections"), { title, pages: selectedPages, order, items: [] });
      document.getElementById("sec-title").value = '';
    } catch (err) {
      alert("Feil ved opprettelse: " + err.message);
    }
  });

  // Content Creation (Single Item)
  document.getElementById("add-item-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const sectionId = document.getElementById("item-section-select").value;
    const statusMsg = document.getElementById("status-msg");

    if (!sectionId) return alert("Velg en målseksjon først!");

    statusMsg.innerText = "Lagrer innhold...";

    try {
      const contentType = document.getElementById("content-type-select").value;
      const title = document.getElementById("item-title").value;
      const sub = document.getElementById("item-sub").value;
      const coverUrl = document.getElementById("item-cover").value;
      const mediaUrl = document.getElementById("item-url").value;
      const desc = document.getElementById("item-desc").value;

      const sectionRef = doc(db, "sections", sectionId);
      const docSnap = await getDoc(sectionRef);

      if (docSnap.exists()) {
        const currentItems = docSnap.data().items || [];
        
        const newItem = { 
          type: contentType,
          title, 
          sub, 
          coverUrl: coverUrl || "", 
          mediaUrl: mediaUrl || "",
          desc 
        };
        
        await updateDoc(sectionRef, { items: [...currentItems, newItem] });

        statusMsg.innerText = "Publisert!";
        document.getElementById("add-item-form").reset();
        document.getElementById("api-results").innerHTML = "";
      }
    } catch (err) {
      statusMsg.innerText = "Feil ved lagring: " + err.message;
    } finally {
      setTimeout(() => statusMsg.innerText = "", 3000);
    }
  });

  // Edit Modal logic
  window.openEditModal = (secId) => {
    const sec = rawSectionsData.find(s => s.id === secId);
    if (!sec) return;

    document.getElementById("edit-sec-id").value = sec.id;
    document.getElementById("edit-sec-title").value = sec.title;
    document.getElementById("edit-sec-order").value = sec.order;

    const pages = Array.isArray(sec.pages) ? sec.pages : [sec.page || 'home'];
    document.querySelectorAll('.edit-sec-target-pages').forEach(cb => {
      cb.checked = pages.includes(cb.value);
    });

    document.getElementById("edit-modal").classList.remove("hidden");
  };

  window.closeEditModal = () => {
    document.getElementById("edit-modal").classList.add("hidden");
  };

  document.getElementById("edit-section-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("edit-sec-id").value;
    const title = document.getElementById("edit-sec-title").value;
    const order = parseInt(document.getElementById("edit-sec-order").value);
    const selectedPages = Array.from(document.querySelectorAll('.edit-sec-target-pages:checked')).map(cb => cb.value);

    try {
      await updateDoc(doc(db, "sections", id), { title, order, pages: selectedPages });
      closeEditModal();
    } catch (err) {
      alert("Feil ved oppdatering: " + err.message);
    }
  });

  // Delete Operations
  window.deleteSection = async (id) => {
    if (confirm("Er du sikker på at du vil slette hele denne seksjonen?")) {
      await deleteDoc(doc(db, "sections", id));
    }
  };

  window.deleteItem = async (sectionId, itemIndex) => {
    if (confirm("Vil du slette dette elementet?")) {
      const sectionRef = doc(db, "sections", sectionId);
      const docSnap = await getDoc(sectionRef);

      if (docSnap.exists()) {
        const currentItems = docSnap.data().items || [];
        currentItems.splice(itemIndex, 1);
        await updateDoc(sectionRef, { items: currentItems });
      }
    }
  };
</script>
</body>
</html>
