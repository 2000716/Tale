<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    updateDoc, 
    deleteDoc, 
    doc, 
    onSnapshot, 
    query, 
    orderBy, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. Firebase Konfigurasjon
  const firebaseConfig = {
    apiKey: "AIzaSyDfJ3IXqeJUkCVcMnPt3ya37Co7Du-f1WU",
    authDomain: "tale-8cadc.firebaseapp.com",
    projectId: "tale-8cadc",
    storageBucket: "tale-8cadc.firebasestorage.app",
    messagingSenderId: "326781333063",
    appId: "1:326781333063:web:c7303967acf8ea79184b62",
    measurementId: "G-W1445B45F4"
  };

  // 2. Radio API Konfigurasjon
  const RADIO_API_CONFIG = {
    baseUrl: "https://de1.api.radio-browser.info/json/stations/search",
    appName: "TaleAdmin/1.0"
  };

  // Initialiser Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  setPersistence(auth, browserLocalPersistence);

  if (location.protocol.startsWith("http")) {
    getAnalytics(app);
  }

  // Tilstander (State)
  let sectionsData = [];
  let mediaQueue = [];

  // DOM Elementer
  const loginCard = document.getElementById('login-card');
  const adminContent = document.getElementById('admin-content');
  const userDisplay = document.getElementById('user-display');
  const logoutBtn = document.getElementById('logout-btn');
  const loginForm = document.getElementById('login-form');
  const loginMsg = document.getElementById('login-msg');

  const addSectionForm = document.getElementById('add-section-form');
  const addItemForm = document.getElementById('add-item-form');
  const contentTypeSelect = document.getElementById('content-type-select');
  const apiSearchBox = document.getElementById('podcast-search-box');
  const apiSearchLabel = document.getElementById('api-search-label');
  const urlLabelText = document.getElementById('url-label-text');
  const itemSectionSelect = document.getElementById('item-section-select');
  const sectionsList = document.getElementById('sections-list');
  const filterInput = document.getElementById('filter-sections-input');

  const apiSearchInput = document.getElementById('api-search-input');
  const apiSearchBtn = document.getElementById('api-search-btn');
  const apiResults = document.getElementById('api-results');
  const selectedQueue = document.getElementById('selected-queue');
  const queueCount = document.getElementById('queue-count');
  const batchPublishBtn = document.getElementById('batch-publish-btn');

  const editModal = document.getElementById('edit-modal');
  const editSectionForm = document.getElementById('edit-section-form');
  const closeModalBtn = document.getElementById('close-modal-btn');
  const cancelModalBtn = document.getElementById('cancel-modal-btn');

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  // --- Autentisering ---
  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (loginCard) loginCard.classList.add('hidden');
      if (adminContent) adminContent.classList.remove('hidden');
      if (logoutBtn) logoutBtn.classList.remove('hidden');
      if (userDisplay) userDisplay.textContent = user.email;
      listenToSections();
    } else {
      if (loginCard) loginCard.classList.remove('hidden');
      if (adminContent) adminContent.classList.add('hidden');
      if (logoutBtn) logoutBtn.classList.add('hidden');
      if (userDisplay) userDisplay.textContent = '';
    }
  });

  if (loginForm) {
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (loginMsg) loginMsg.textContent = "Logger inn...";
      try {
        await signInWithEmailAndPassword(
          auth, 
          document.getElementById('login-email').value, 
          document.getElementById('login-password').value
        );
        if (loginMsg) loginMsg.textContent = "";
      } catch (err) {
        if (loginMsg) loginMsg.textContent = "Feil ved innlogging: " + err.message;
      }
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => signOut(auth));
  }

  // --- Sanntidssynkronisering av data ---
  function listenToSections() {
    const q = query(collection(db, "sections"), orderBy("order", "asc"));
    onSnapshot(q, (snapshot) => {
      sectionsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderSections();
      populateSectionDropdown();
    });
  }

  // --- Dynamisk endring av skjema basert på innholdstype ---
  if (contentTypeSelect) {
    contentTypeSelect.addEventListener('change', (e) => {
      const type = e.target.value;
      if (apiResults) apiResults.innerHTML = '';
      if (apiSearchInput) apiSearchInput.value = '';

      if (type === 'podcast') {
        if (apiSearchBox) apiSearchBox.classList.remove('hidden');
        if (apiSearchLabel) apiSearchLabel.textContent = "Søk Apple Podkaster";
        if (apiSearchInput) apiSearchInput.placeholder = "Søk etter podcast på iTunes...";
        if (urlLabelText) urlLabelText.textContent = "RSS Feed URL";
      } else if (type === 'radio') {
        if (apiSearchBox) apiSearchBox.classList.remove('hidden');
        if (apiSearchLabel) apiSearchLabel.textContent = "Søk Radiokanaler (Radio-Browser API)";
        if (apiSearchInput) apiSearchInput.placeholder = "Søk etter radiokanal (f.eks. NRK, P4)...";
        if (urlLabelText) urlLabelText.textContent = "Radio Stream URL (MP3/AAC/HLS)";
      } else {
        if (apiSearchBox) apiSearchBox.classList.add('hidden');
        if (urlLabelText) urlLabelText.textContent = "Lydfil URL (MP3)";
      }
    });
  }

  function populateSectionDropdown() {
    if (!itemSectionSelect) return;
    itemSectionSelect.innerHTML = sectionsData.length ? '' : '<option value="">Ingen seksjoner tilgjengelig</option>';
    sectionsData.forEach(sec => {
      const opt = document.createElement('option');
      opt.value = sec.id;
      opt.textContent = `${sec.title} (${(sec.targetPages || []).join(', ')})`;
      itemSectionSelect.appendChild(opt);
    });
  }

  // --- Legg til ny seksjon ---
  if (addSectionForm) {
    addSectionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const targetPages = Array.from(document.querySelectorAll('.sec-target-pages:checked')).map(cb => cb.value);
      const title = document.getElementById('sec-title').value;
      const order = parseInt(document.getElementById('sec-order').value, 10);

      try {
        await addDoc(collection(db, "sections"), {
          title,
          targetPages,
          order,
          items: [],
          createdAt: serverTimestamp()
        });
        addSectionForm.reset();
      } catch (err) {
        alert("Feil ved opprettelse: " + err.message);
      }
    });
  }

  // --- Legg til enkelt-element manuelt ---
  if (addItemForm) {
    addItemForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const sectionId = itemSectionSelect.value;
      if (!sectionId) return alert("Vennligst velg en seksjon");

      const newItem = {
        id: crypto.randomUUID(),
        type: contentTypeSelect.value,
        title: document.getElementById('item-title').value,
        subtitle: document.getElementById('item-sub').value,
        coverUrl: document.getElementById('item-cover').value,
        streamUrl: document.getElementById('item-url').value,
        description: document.getElementById('item-desc').value
      };

      const sec = sectionsData.find(s => s.id === sectionId);
      if (!sec) return;

      try {
        await updateDoc(doc(db, "sections", sectionId), {
          items: [...(sec.items || []), newItem]
        });
        addItemForm.reset();
        const statusMsg = document.getElementById('status-msg');
        if (statusMsg) {
          statusMsg.textContent = "Innhold publisert!";
          setTimeout(() => statusMsg.textContent = "", 3000);
        }
      } catch (err) {
        alert("Feil ved lagring av innhold: " + err.message);
      }
    });
  }

  // --- API Søk ---
  if (apiSearchBtn) apiSearchBtn.addEventListener('click', performApiSearch);
  if (apiSearchInput) {
    apiSearchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performApiSearch(); });
  }

  function performApiSearch() {
    const type = contentTypeSelect.value;
    if (type === 'podcast') {
      searchiTunes();
    } else if (type === 'radio') {
      searchRadioAPI();
    }
  }

  async function searchiTunes() {
    const term = apiSearchInput.value.trim();
    if (!term) return;
    apiResults.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted);">Søker i iTunes...</div>';

    try {
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=podcast&limit=10`);
      const data = await res.json();
      
      apiResults.innerHTML = '';
      if(!data.results || data.results.length === 0) {
        apiResults.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted);">Ingen podkaster funnet.</div>';
        return;
      }

      data.results.forEach(pod => {
        const itemData = {
          id: crypto.randomUUID(),
          type: 'podcast',
          title: pod.collectionName,
          subtitle: pod.artistName,
          coverUrl: pod.artworkUrl600 || pod.artworkUrl100,
          streamUrl: pod.feedUrl,
          description: pod.primaryGenreName || ''
        };
        renderApiResultCard(pod.artworkUrl60, pod.collectionName, pod.artistName, itemData);
      });
    } catch (err) {
      apiResults.innerHTML = '<div style="font-size:0.8rem; color:var(--danger);">Klarte ikke hente fra iTunes API.</div>';
    }
  }

  async function searchRadioAPI() {
    const term = apiSearchInput.value.trim();
    if (!term) return;
    apiResults.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted);">Søker i Radio Database...</div>';

    try {
      const url = `${RADIO_API_CONFIG.baseUrl}?name=${encodeURIComponent(term)}&limit=10&order=clickcount&reverse=true`;
      const res = await fetch(url, {
        headers: {
          'User-Agent': RADIO_API_CONFIG.appName
        }
      });
      const data = await res.json();

      apiResults.innerHTML = '';
      if (!data || !data.length) {
        apiResults.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted);">Ingen radiokanaler funnet.</div>';
        return;
      }

      data.forEach(station => {
        const itemData = {
          id: crypto.randomUUID(),
          type: 'radio',
          title: station.name.trim(),
          subtitle: station.country ? `${station.country} • ${station.tags}` : station.tags,
          coverUrl: station.favicon || 'https://via.placeholder.com/100?text=Radio',
          streamUrl: station.url_resolved || station.url,
          description: `Codec: ${station.codec} | Bitrate: ${station.bitrate}kbps`
        };
        
        renderApiResultCard(
          station.favicon || 'https://via.placeholder.com/40?text=Radio', 
          station.name, 
          station.country || 'Radio', 
          itemData
        );
      });
    } catch (err) {
      apiResults.innerHTML = '<div style="font-size:0.8rem; color:var(--danger);">Klarte ikke hente fra Radio API.</div>';
    }
  }

  function renderApiResultCard(imageSrc, title, subtitle, itemData) {
    const item = document.createElement('div');
    item.className = 'api-result-item';
    item.innerHTML = `
      <div class="api-result-left">
        <img src="${imageSrc}" alt="Cover" onerror="this.src='https://via.placeholder.com/40'">
        <div class="api-result-text">
          <strong>${escapeHtml(title)}</strong><br>
          <small style="color:var(--text-muted);">${escapeHtml(subtitle)}</small>
        </div>
      </div>
      <button type="button" class="btn btn-sm btn-secondary">+ Legg i kø</button>
    `;

    item.querySelector('button').addEventListener('click', () => addToQueue(itemData));
    apiResults.appendChild(item);
  }

  // --- Køhåndtering & Batch Publisering ---
  function addToQueue(item) {
    mediaQueue.push(item);
    if (queueCount) queueCount.textContent = mediaQueue.length;
    if (selectedQueue) selectedQueue.classList.remove('hidden');
  }

  if (batchPublishBtn) {
    batchPublishBtn.addEventListener('click', async () => {
      const sectionId = itemSectionSelect.value;
      if (!sectionId) return alert("Velg en målseksjon før du publiserer køen.");
      if (!mediaQueue.length) return;

      const sec = sectionsData.find(s => s.id === sectionId);
      if (!sec) return;

      try {
        await updateDoc(doc(db, "sections", sectionId), {
          items: [...(sec.items || []), ...mediaQueue]
        });
        mediaQueue = [];
        if (queueCount) queueCount.textContent = "0";
        if (selectedQueue) selectedQueue.classList.add('hidden');
        alert("Køen er publisert!");
      } catch (err) {
        alert("Feil ved publisering av batch: " + err.message);
      }
    });
  }

  // --- Filtrering av seksjoner ---
  if (filterInput) {
    filterInput.addEventListener('input', renderSections);
  }

  // --- Vis Seksjoner og Innhold ---
  function renderSections() {
    if (!sectionsList) return;
    const queryVal = filterInput ? filterInput.value.toLowerCase() : '';
    sectionsList.innerHTML = '';

    const filtered = sectionsData.filter(sec => 
      sec.title.toLowerCase().includes(queryVal) || 
      (sec.items && sec.items.some(i => i.title.toLowerCase().includes(queryVal)))
    );

    if (!filtered.length) {
      sectionsList.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:2rem;">Ingen seksjoner funnet.</div>';
      return;
    }

    filtered.forEach(sec => {
      const card = document.createElement('div');
      card.className = 'section-card';
      
      const tags = (sec.targetPages || []).map(p => `<span class="tag-badge">${p}</span>`).join('');
      
      const itemsHtml = (sec.items || []).map(item => `
        <div class="item-card">
          <div class="item-info">
            <img src="${item.coverUrl || 'https://via.placeholder.com/40'}" class="item-thumbnail" onerror="this.src='https://via.placeholder.com/40'">
            <div style="overflow:hidden;">
              <div style="font-size:0.85rem; font-weight:600; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
                ${escapeHtml(item.title)} <span class="type-badge">${item.type}</span>
              </div>
              <div style="font-size:0.75rem; color:var(--text-muted);">${escapeHtml(item.subtitle)}</div>
            </div>
          </div>
          <button class="btn btn-danger btn-delete-item" data-sec-id="${sec.id}" data-item-id="${item.id}">Slett</button>
        </div>
      `).join('');

      card.innerHTML = `
        <div class="section-header">
          <div>
            <h4 style="font-size:1.1rem; font-weight:600;">${escapeHtml(sec.title)} <small style="font-size:0.75rem; color:var(--text-muted);">(Rekkefølge: ${sec.order})</small></h4>
            <div style="margin-top:0.3rem;">${tags}</div>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn btn-edit btn-edit-sec" data-id="${sec.id}">Rediger</button>
            <button class="btn btn-danger btn-delete-sec" data-id="${sec.id}">Slett</button>
          </div>
        </div>
        <div class="item-grid">${itemsHtml || '<div style="font-size:0.8rem; color:var(--text-muted);">Ingen innhold lagt til ennå.</div>'}</div>
      `;

      sectionsList.appendChild(card);
    });

    // Event listeners for dynamiske knapper i seksjonslisten
    document.querySelectorAll('.btn-delete-sec').forEach(btn => {
      btn.addEventListener('click', (e) => deleteSection(e.target.dataset.id));
    });

    document.querySelectorAll('.btn-edit-sec').forEach(btn => {
      btn.addEventListener('click', (e) => openEditModal(e.target.dataset.id));
    });

    document.querySelectorAll('.btn-delete-item').forEach(btn => {
      btn.addEventListener('click', (e) => deleteItem(e.target.dataset.secId, e.target.dataset.itemId));
    });
  }

  // --- Sletting av seksjon og innhold ---
  async function deleteSection(id) {
    if (!confirm("Er du sikker på at du vil slette denne seksjonen og alt innhold i den?")) return;
    try {
      await deleteDoc(doc(db, "sections", id));
    } catch (err) {
      alert("Feil ved sletting av seksjon: " + err.message);
    }
  }

  async function deleteItem(secId, itemId) {
    const sec = sectionsData.find(s => s.id === secId);
    if (!sec) return;
    const updatedItems = (sec.items || []).filter(i => i.id !== itemId);
    try {
      await updateDoc(doc(db, "sections", secId), { items: updatedItems });
    } catch (err) {
      alert("Feil ved sletting av element: " + err.message);
    }
  }

  // --- Redigeringsmodal Logikk ---
  function openEditModal(id) {
    const sec = sectionsData.find(s => s.id === id);
    if (!sec) return;

    document.getElementById('edit-sec-id').value = sec.id;
    document.getElementById('edit-sec-title').value = sec.title;
    document.getElementById('edit-sec-order').value = sec.order;

    document.querySelectorAll('.edit-sec-target-pages').forEach(cb => {
      cb.checked = (sec.targetPages || []).includes(cb.value);
    });

    editModal.classList.remove('hidden');
  }

  function closeEditModal() {
    editModal.classList.add('hidden');
  }

  if (closeModalBtn) closeModalBtn.addEventListener('click', closeEditModal);
  if (cancelModalBtn) cancelModalBtn.addEventListener('click', closeEditModal);

  if (editSectionForm) {
    editSectionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-sec-id').value;
      const title = document.getElementById('edit-sec-title').value;
      const order = parseInt(document.getElementById('edit-sec-order').value, 10);
      const targetPages = Array.from(document.querySelectorAll('.edit-sec-target-pages:checked')).map(cb => cb.value);

      try {
        await updateDoc(doc(db, "sections", id), {
          title,
          order,
          targetPages
        });
        closeEditModal();
      } catch (err) {
        alert("Feil ved oppdatering av seksjon: " + err.message);
      }
    });
  }
</script>
</body>
</html>
