<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tale – Admin Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #f1f5f9; padding: 2rem 1rem; min-height: 100vh; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 2rem; 
      border-bottom: 1px solid #1e293b; 
      padding-bottom: 1.5rem; 
    }
    h1 { color: #ffffff; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p.subtitle { color: #64748b; font-size: 0.875rem; margin-top: 0.25rem; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: #0f172a; padding: 1.5rem; border-radius: 8px; border: 1px solid #1e293b; }
    .card.full-width { grid-column: 1 / -1; }
    
    h3 { margin-bottom: 1.25rem; color: #f8fafc; font-size: 1rem; font-weight: 600; border-bottom: 1px solid #1e293b; padding-bottom: 0.75rem; }
    
    .form-group { margin-bottom: 1rem; }
    .checkbox-group-container { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem; background: #020617; padding: 0.8rem; border-radius: 6px; border: 1px solid #334155; }
    .checkbox-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; color: #cbd5e1; cursor: pointer; }
    .checkbox-item input { width: auto; cursor: pointer; }

    label { display: block; font-size: 0.8rem; font-weight: 500; color: #94a3b8; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select, textarea { width: 100%; padding: 0.65rem 0.8rem; background: #020617; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; font-size: 0.875rem; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    
    button { background: #0284c7; color: #ffffff; padding: 0.65rem 1rem; border: none; border-radius: 6px; font-weight: 500; font-size: 0.875rem; cursor: pointer; width: 100%; transition: background-color 0.2s; }
    button:hover { background: #0369a1; }
    
    .btn-secondary { background: #334155; color: #f8fafc; width: auto; padding: 0.4rem 0.8rem; }
    .btn-secondary:hover { background: #475569; }

    .btn-delete { background: #dc2626; color: white; padding: 0.35rem 0.75rem; font-size: 0.75rem; width: auto; }
    .btn-delete:hover { background: #b91c1c; }
    
    .section-card { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #0f172a; }
    
    .item-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 0.6rem 0.8rem; border-radius: 4px; margin-top: 0.5rem; font-size: 0.85rem; }
    .item-info { display: flex; align-items: center; gap: 0.75rem; }
    .item-thumbnail { width: 32px; height: 32px; background: #1e293b; border-radius: 4px; object-fit: cover; }
    
    .status-msg { font-size: 0.85rem; color: #38bdf8; margin-top: 0.75rem; text-align: center; min-height: 1.2rem; }
    .badge { display: inline-block; padding: 0.15rem 0.4rem; background: #1e293b; border-radius: 4px; font-size: 0.7rem; color: #38bdf8; font-weight: 600; text-transform: uppercase; margin-right: 0.25rem; }
    .badge-layout { background: #0284c7; color: white; }
    
    .api-box {
      background: #020617;
      border: 1px solid #0284c7;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1.25rem;
    }
    .api-search-row { display: flex; gap: 0.5rem; }
    .api-search-row input { flex: 1; }
    .api-search-row button { width: auto; white-space: nowrap; }
    
    .api-results-container {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .api-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .api-result-item img { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }
    .api-result-left { display: flex; align-items: center; gap: 0.5rem; overflow: hidden; }
    .api-result-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-api-select { background: #10b981; color: white; padding: 0.25rem 0.6rem; font-size: 0.75rem; width: auto; }
    .btn-api-select:hover { background: #059669; }

    .selected-queue {
      margin-top: 0.75rem;
      padding: 0.5rem;
      background: #0f172a;
      border-radius: 4px;
      border: 1px dashed #334155;
      font-size: 0.8rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Tale — Admin Control Panel</h1>
        <p class="subtitle">Full kontroll over oppsett, seksjoner og layout</p>
      </div>
      <button id="logout-btn" class="btn-secondary hidden">Logg ut</button>
    </header>

    <!-- INNLOGGINGSSKJEMA -->
    <div id="login-card" class="card" style="max-width: 380px; margin: 4rem auto;">
      <h3>Administrator Autentisering</h3>
      <form id="login-form">
        <div class="form-group">
          <label>E-postadresse</label>
          <input type="email" id="login-email" placeholder="admin@tale.no" required>
        </div>
        <div class="form-group">
          <label>Passord</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit">Logg inn</button>
        <div id="login-msg" class="status-msg"></div>
      </form>
    </div>

    <!-- ADMIN PANELS -->
    <div id="admin-content" class="grid hidden">
      
      <!-- 1. OPPRETT SEKSJON / LAYOUT -->
      <div class="card">
        <h3>1. Opprett / Konfigurer Seksjonsoppsett</h3>
        <form id="add-section-form">
          <div class="form-group">
            <label>Navn på Seksjon</label>
            <input type="text" id="sec-title" placeholder="f.eks. Ukens Utvalgte / Stort Banner" required>
          </div>

          <div class="form-group">
            <label>Velg Design / Layout-oppsett</label>
            <select id="sec-layout" required>
              <option value="grid-2">Todelt galleri (2 store kolonner)</option>
              <option value="grid-3" selected>Standard galleri (3 kolonner)</option>
              <option value="grid-4">Kompakt galleri (4 små kolonner)</option>
              <option value="banner">Stort fremhevet banner (Full bredde)</option>
              <option value="spotlight">Spotlight-visning (Stort bilde til venstre)</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Vis på følgende sider:</label>
            <div class="checkbox-group-container">
              <label class="checkbox-item"><input type="checkbox" value="home" class="sec-target-pages" checked> Hjem</label>
              <label class="checkbox-item"><input type="checkbox" value="audiobooks" class="sec-target-pages"> Lydbøker</label>
              <label class="checkbox-item"><input type="checkbox" value="podcasts" class="sec-target-pages"> Podkaster</label>
              <label class="checkbox-item"><input type="checkbox" value="radio" class="sec-target-pages"> Radio</label>
            </div>
          </div>

          <div class="form-group">
            <label>Visningsrekkefølge (Tall)</label>
            <input type="number" id="sec-order" value="1" required>
          </div>

          <button type="submit">Opprett Ny Seksjon</button>
        </form>
      </div>

      <!-- 2. LEGG TIL INNHOLD -->
      <div class="card">
        <h3>2. Legg til Innhold i Seksjon</h3>
        
        <div class="form-group">
          <label>Innholdstype</label>
          <select id="content-type-select">
            <option value="podcast">Podkast (Søk via Apple API)</option>
            <option value="audiobook">Lydbok / Manuell</option>
            <option value="radio">Radio Kanal / Stream</option>
          </select>
        </div>

        <div id="podcast-search-box" class="api-box">
          <label style="color: #38bdf8;">Søk og hent fra Apple Podkaster</label>
          <div class="api-search-row">
            <input type="text" id="api-search-input" placeholder="Søk tittel...">
            <button type="button" id="api-search-btn">Søk</button>
          </div>
          <div id="api-results" class="api-results-container"></div>
        </div>

        <form id="add-item-form">
          <div class="form-group">
            <label>Velg Målseksjon i Appen</label>
            <select id="item-section-select" required>
              <option value="">Laster seksjoner...</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tittel</label>
            <input type="text" id="item-title" placeholder="Tittel" required>
          </div>

          <div class="form-group">
            <label>Undertekst / Utgiver</label>
            <input type="text" id="item-sub" placeholder="f.eks. Forfatter eller kanal" required>
          </div>

          <div class="form-group">
            <label>Cover Bilde-URL (HTTPS)</label>
            <input type="url" id="item-cover" placeholder="https://...">
          </div>

          <div class="form-group">
            <label id="url-label-text">RSS Feed URL / Stream URL</label>
            <input type="url" id="item-rss" placeholder="https://...">
          </div>

          <div class="form-group">
            <label>Beskrivelse</label>
            <textarea id="item-desc" placeholder="Beskrivelse..." rows="2"></textarea>
          </div>

          <button type="submit" id="save-btn">Legg til i Seksjon</button>
          <div id="status-msg" class="status-msg"></div>
        </form>
      </div>

      <!-- 3. OVERSIKT -->
      <div class="card full-width">
        <h3>Aktive Seksjoner og Layout-struktur i Firestore</h3>
        <div id="sections-list">Laster inn struktur...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDoc, arrayUnion, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfJ3IXqeJUkCVcMnPt3ya37Co7Du-f1WU",
      authDomain: "tale-8cadc.firebaseapp.com",
      projectId: "tale-8cadc",
      storageBucket: "tale-8cadc.firebasestorage.app",
      messagingSenderId: "326781333063",
      appId: "1:326781333063:web:c7303967acf8ea79184b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("login-card").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        document.getElementById("logout-btn").classList.remove("hidden");
        loadDatabaseContent();
      } else {
        document.getElementById("login-card").classList.remove("hidden");
        document.getElementById("admin-content").classList.add("hidden");
        document.getElementById("logout-btn").classList.add("hidden");
      }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("login-email").value, document.getElementById("login-password").value);
      } catch (err) {
        document.getElementById("login-msg").innerText = "Feil ved innlogging.";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    let searchResultsCache = [];
    document.getElementById("api-search-btn").addEventListener("click", async () => {
      const term = document.getElementById("api-search-input").value.trim();
      const resultsContainer = document.getElementById("api-results");
      if (!term) return;

      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=podcast&country=NO&limit=10`);
      const data = await res.json();
      searchResultsCache = data.results || [];
      resultsContainer.innerHTML = '';

      searchResultsCache.forEach((pod, index) => {
        const row = document.createElement("div");
        row.className = "api-result-item";
        row.innerHTML = `
          <div class="api-result-left">
            <img src="${pod.artworkUrl100 || ''}" alt="">
            <div class="api-result-text"><strong>${pod.collectionName}</strong></div>
          </div>
          <button type="button" class="btn-api-select" onclick="selectApiPodcast(${index})">Velg</button>
        `;
        resultsContainer.appendChild(row);
      });
    });

    window.selectApiPodcast = (index) => {
      const pod = searchResultsCache[index];
      if (!pod) return;
      document.getElementById("item-title").value = pod.collectionName || "";
      document.getElementById("item-sub").value = pod.artistName || "";
      document.getElementById("item-cover").value = pod.artworkUrl600 || "";
      document.getElementById("item-rss").value = pod.feedUrl || "";
      document.getElementById("item-desc").value = pod.primaryGenreName || "";
    };

    function loadDatabaseContent() {
      const sectionsSelect = document.getElementById("item-section-select");
      const sectionsList = document.getElementById("sections-list");

      const q = query(collection(db, "sections"), orderBy("order", "asc"));
      onSnapshot(q, (snapshot) => {
        sectionsSelect.innerHTML = '<option value="">-- Velg Seksjon --</option>';
        sectionsList.innerHTML = '';

        snapshot.forEach((docSnap) => {
          const sec = docSnap.data();
          const id = docSnap.id;
          const pages = Array.isArray(sec.pages) ? sec.pages : [sec.page || 'home'];
          const layout = sec.layout || 'grid-3';

          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = `[${pages.join(", ").toUpperCase()}] ${sec.title} (${layout})`;
          sectionsSelect.appendChild(opt);

          const secCard = document.createElement("div");
          secCard.className = "section-card";

          let itemsHtml = (sec.items || []).map((item, index) => `
            <div class="item-row">
              <div class="item-info">
                ${item.coverUrl ? `<img src="${item.coverUrl}" class="item-thumbnail" alt="">` : `<div class="item-thumbnail"></div>`}
                <div><strong>${item.title}</strong> <span style="color:#64748b">(${item.sub})</span></div>
              </div>
              <button class="btn-delete" onclick="deleteItem('${id}', ${index})">Slett element</button>
            </div>
          `).join("") || '<div style="color: #475569; font-size: 0.8rem;">Ingen elementer her ennå.</div>';

          secCard.innerHTML = `
            <div class="section-header">
              <div>
                ${pages.map(p => `<span class="badge">${p}</span>`).join("")}
                <span class="badge badge-layout">${layout}</span>
                <strong style="margin-left: 0.5rem;">${sec.title}</strong>
              </div>
              <button class="btn-delete" onclick="deleteSection('${id}')">Slett Seksjon</button>
            </div>
            ${itemsHtml}
          `;
          sectionsList.appendChild(secCard);
        });
      });
    }

    document.getElementById("add-section-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("sec-title").value;
      const order = parseInt(document.getElementById("sec-order").value);
      const layout = document.getElementById("sec-layout").value;
      const selectedPages = Array.from(document.querySelectorAll('.sec-target-pages:checked')).map(cb => cb.value);

      await addDoc(collection(db, "sections"), { title, pages: selectedPages, order, layout, items: [] });
      document.getElementById("sec-title").value = '';
        
    });

    document.getElementById("add-item-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sectionId = document.getElementById("item-section-select").value;
      if (!sectionId) return alert("Velg seksjon!");

      const sectionRef = doc(db, "sections", sectionId);
      await updateDoc(sectionRef, {
        items: arrayUnion({
          title: document.getElementById("item-title").value,
          sub: document.getElementById("item-sub").value,
          coverUrl: document.getElementById("item-cover").value,
          rssUrl: document.getElementById("item-rss").value,
          desc: document.getElementById("item-desc").value
        })
      });
      document.getElementById("add-item-form").reset();
      document.getElementById("status-msg").innerText = "Lagt til!";
      setTimeout(() => document.getElementById("status-msg").innerText = "", 2000);
    });

    window.deleteSection = async (id) => { if (confirm("Slett seksjon?")) await deleteDoc(doc(db, "sections", id)); };
    window.deleteItem = async (sectionId, itemIndex) => {
      const sectionRef = doc(db, "sections", sectionId);
      const docSnap = await getDoc(sectionRef);
      if (docSnap.exists()) {
        const currentItems = docSnap.data().items || [];
        currentItems.splice(itemIndex, 1);
        await updateDoc(sectionRef, { items: currentItems });
      }
    };
  </script>
</body>
</html>
