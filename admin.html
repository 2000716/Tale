<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tale – Admin Control Panel</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --input-bg: #020617;
      --border: #1e293b;
      --border-focus: #38bdf8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 2rem; 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 1.5rem; 
    }
    h1 { color: #ffffff; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--card-bg); padding: 1.5rem; border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .card.full-width { grid-column: 1 / -1; }
    
    h3 { margin-bottom: 1.25rem; color: #ffffff; font-size: 1.05rem; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    
    .form-group { margin-bottom: 1rem; }
    .checkbox-group-container { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem; background: var(--input-bg); padding: 0.8rem; border-radius: 8px; border: 1px solid #334155; }
    .checkbox-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #cbd5e1; cursor: pointer; }
    .checkbox-item input { width: auto; cursor: pointer; }

    label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select, textarea { width: 100%; padding: 0.65rem 0.8rem; background: var(--input-bg); border: 1px solid #334155; color: var(--text); border-radius: 6px; font-size: 0.875rem; transition: all 0.2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    
    button { background: var(--primary); color: #ffffff; padding: 0.65rem 1rem; border: none; border-radius: 6px; font-weight: 600; font-size: 0.875rem; cursor: pointer; width: 100%; transition: background-color 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 0.5rem; }
    button:hover { background: var(--primary-hover); }
    
    .btn-secondary { background: #334155; color: var(--text); width: auto; padding: 0.4rem 0.8rem; }
    .btn-secondary:hover { background: #475569; }

    .btn-delete { background: var(--danger); color: white; padding: 0.35rem 0.75rem; font-size: 0.75rem; width: auto; border-radius: 4px; }
    .btn-delete:hover { background: var(--danger-hover); }
    
    .section-card { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    
    .item-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 0.6rem 0.8rem; border-radius: 6px; margin-top: 0.5rem; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.03); }
    .item-info { display: flex; align-items: center; gap: 0.75rem; }
    .item-thumbnail { width: 36px; height: 36px; background: #1e293b; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    
    .status-msg { font-size: 0.85rem; color: var(--border-focus); margin-top: 0.75rem; text-align: center; min-height: 1.2rem; font-weight: 500; }
    .badge { display: inline-block; padding: 0.15rem 0.4rem; background: #1e293b; border-radius: 4px; font-size: 0.7rem; color: var(--border-focus); font-weight: 600; text-transform: uppercase; margin-right: 0.25rem; }
    
    /* API Søke-boks elementer */
    .api-box { background: var(--input-bg); border: 1px solid var(--primary); border-radius: 8px; padding: 1rem; margin-bottom: 1.25rem; }
    .api-search-row { display: flex; gap: 0.5rem; }
    .api-search-row input { flex: 1; }
    .api-search-row button { width: auto; white-space: nowrap; }
    
    .api-results-container { max-height: 220px; overflow-y: auto; margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; padding-right: 4px; }
    .api-result-item { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.8rem; border: 1px solid var(--border); }
    .api-result-item img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }
    .api-result-left { display: flex; align-items: center; gap: 0.6rem; overflow: hidden; }
    .api-result-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-api-select { background: var(--success); color: white; padding: 0.3rem 0.6rem; font-size: 0.75rem; width: auto; border-radius: 4px; }
    .btn-api-select:hover { background: #059669; }
    .btn-api-select.selected { background: #64748b; }

    .selected-queue { margin-top: 0.75rem; padding: 0.75rem; background: var(--card-bg); border-radius: 6px; border: 1px dashed #334155; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
    .selected-queue button { width: auto; padding: 0.3rem 0.6rem; font-size: 0.75rem; background: var(--success); }

    .hidden { display: none !important; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--input-bg); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Tale — Admin Control Panel</h1>
        <p class="subtitle">Systembehandling og innholdsstyring i sanntid</p>
      </div>
      <button id="logout-btn" class="btn-secondary hidden">Logg ut</button>
    </header>

    <!-- INNLOGGINGSSKJEMA -->
    <div id="login-card" class="card" style="max-width: 380px; margin: 4rem auto;">
      <h3>Administrator Autentisering</h3>
      <form id="login-form">
        <div class="form-group">
          <label>E-postadresse</label>
          <input type="email" id="login-email" placeholder="admin@tale.no" required>
        </div>
        <div class="form-group">
          <label>Passord</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit">Logg inn</button>
        <div id="login-msg" class="status-msg"></div>
      </form>
    </div>

    <!-- ADMIN PANELS -->
    <div id="admin-content" class="grid hidden">
      
      <!-- 1. OPPRETT SEKSJON -->
      <div class="card">
        <h3>1. Opprett Kategori / Seksjon</h3>
        <form id="add-section-form">
          <div class="form-group">
            <label>Navn på Seksjon</label>
            <input type="text" id="sec-title" placeholder="f.eks. Populære Podkaster" required>
          </div>
          
          <div class="form-group">
            <label>Vis på følgende sider:</label>
            <div class="checkbox-group-container">
              <label class="checkbox-item"><input type="checkbox" value="home" class="sec-target-pages" checked> Hjem</label>
              <label class="checkbox-item"><input type="checkbox" value="audiobooks" class="sec-target-pages"> Lydbøker</label>
              <label class="checkbox-item"><input type="checkbox" value="podcasts" class="sec-target-pages"> Podkaster</label>
              <label class="checkbox-item"><input type="checkbox" value="radio" class="sec-target-pages"> Radio</label>
            </div>
          </div>

          <div class="form-group">
            <label>Visningsrekkefølge (Prioritet/Tall)</label>
            <input type="number" id="sec-order" value="1" required>
          </div>

          <button type="submit">Opprett Seksjon</button>
        </form>
      </div>

      <!-- 2. LEGG TIL INNHOLD -->
      <div class="card">
        <h3>2. Legg til Innhold / Media</h3>
        
        <!-- Type velger -->
        <div class="form-group">
          <label>Velg Innholdstype</label>
          <select id="content-type-select">
            <option value="podcast">Podkast (Søk via Apple API / RSS)</option>
            <option value="audiobook">Lydbok / Bok (Manuell input)</option>
            <option value="radio">Radio Kanal / Stream</option>
          </select>
        </div>

        <!-- Apple Podkast Søkefelt -->
        <div id="podcast-search-box" class="api-box">
          <label style="color: var(--border-focus);">Søk og fyll ut fra Apple Podkaster</label>
          <div class="api-search-row">
            <input type="text" id="api-search-input" placeholder="Søk tittel (f.eks. NRK, Oppdatert)...">
            <button type="button" id="api-search-btn">Søk</button>
          </div>
          <div id="api-results" class="api-results-container"></div>
          
          <!-- Kø for masseimport -->
          <div id="selected-queue" class="selected-queue hidden">
            <span>Valgte elementer i kø: <strong id="queue-count">0</strong></span>
            <button type="button" id="batch-publish-btn">Publiser alle i kø</button>
          </div>
        </div>

        <form id="add-item-form">
          <div class="form-group">
            <label>Velg Målseksjon i Appen</label>
            <select id="item-section-select" required>
              <option value="">Laster seksjoner...</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tittel</label>
            <input type="text" id="item-title" placeholder="Tittel på mediet" required>
          </div>

          <div class="form-group">
            <label>Utgiver / Forfatter / Sjanger</label>
            <input type="text" id="item-sub" placeholder="f.eks. NRK, Forlaget, Krim" required>
          </div>

          <div class="form-group">
            <label>Cover Bilde-URL (HTTPS)</label>
            <input type="url" id="item-cover" placeholder="https://domene.no/bilde.jpg">
          </div>

          <div class="form-group" id="url-field-group">
            <label id="url-label-text">RSS Feed URL</label>
            <input type="url" id="item-rss" placeholder="https://eksempel.no/feed.xml">
          </div>

          <div class="form-group">
            <label>Beskrivelse</label>
            <textarea id="item-desc" placeholder="Kort beskrivelse..." rows="2"></textarea>
          </div>

          <button type="submit" id="save-btn">Publiser Enkelt-Innhold</button>
          <div id="status-msg" class="status-msg"></div>
        </form>
      </div>

      <!-- 3. OVERSIKT OVER SEKSJONER -->
      <div class="card full-width">
        <h3>Aktive Seksjoner og Innhold i Firestore</h3>
        <div id="sections-list">Laster inn struktur...</div>
      </div>
    </div>
  </div>

  <!-- FIREBASE INTEGRASJON -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDoc, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfJ3IXqeJUkCVcMnPt3ya37Co7Du-f1WU",
      authDomain: "tale-8cadc.firebaseapp.com",
      projectId: "tale-8cadc",
      storageBucket: "tale-8cadc.firebasestorage.app",
      messagingSenderId: "326781333063",
      appId: "1:326781333063:web:c7303967acf8ea79184b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const loginCard = document.getElementById("login-card");
    const adminContent = document.getElementById("admin-content");
    const loginMsg = document.getElementById("login-msg");
    const logoutBtn = document.getElementById("logout-btn");

    let queueItems = []; // Kø for massepulishing fra Apple API

    // Håndter innloggingsstatus
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginCard.classList.add("hidden");
        adminContent.classList.remove("hidden");
        logoutBtn.classList.remove("hidden");
        loadDatabaseContent();
      } else {
        loginCard.classList.remove("hidden");
        adminContent.classList.add("hidden");
        logoutBtn.classList.add("hidden");
      }
    });

    // Innlogging
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("login-email").value, document.getElementById("login-password").value);
        loginMsg.innerText = "";
      } catch (err) {
        loginMsg.innerText = "Feil ved innlogging: " + err.message;
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    // Endre grensesnitt basert på valgt innholdstype
    document.getElementById("content-type-select").addEventListener("change", (e) => {
      const type = e.target.value;
      const podcastBox = document.getElementById("podcast-search-box");
      const urlLabel = document.getElementById("url-label-text");
      const rssInput = document.getElementById("item-rss");

      if (type === "podcast") {
        podcastBox.classList.remove("hidden");
        urlLabel.innerText = "RSS Feed URL";
        rssInput.placeholder = "https://eksempel.no/feed.xml";
      } else if (type === "audiobook") {
        podcastBox.classList.add("hidden");
        urlLabel.innerText = "Lydfil / Bok URL (Valgfri)";
        rssInput.placeholder = "https://eksempel.no/lydbok.mp3";
      } else if (type === "radio") {
        podcastBox.classList.add("hidden");
        urlLabel.innerText = "Radio Stream URL (Icecast/HLS)";
        rssInput.placeholder = "https://stream.eksempel.no/radio";
      }
    });

    // --- ITUNES API SØK ---
    let searchResultsCache = [];
    document.getElementById("api-search-btn").addEventListener("click", async () => {
      const term = document.getElementById("api-search-input").value.trim();
      const resultsContainer = document.getElementById("api-results");
      if (!term) return alert("Skriv inn et søkeord.");

      resultsContainer.innerHTML = '<div style="color: #94a3b8; font-size: 0.8rem; padding: 0.5rem 0;">Søker hos Apple Podkaster...</div>';

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=podcast&country=NO&limit=20`);
        const data = await res.json();
        searchResultsCache = data.results || [];
        resultsContainer.innerHTML = '';

        if (searchResultsCache.length === 0) {
          resultsContainer.innerHTML = '<div style="color: #64748b; font-size: 0.8rem;">Ingen treff funnet.</div>';
          return;
        }

        searchResultsCache.forEach((pod, index) => {
          const row = document.createElement("div");
          row.className = "api-result-item";
          row.innerHTML = `
            <div class="api-result-left">
              <img src="${pod.artworkUrl100 || ''}" alt="">
              <div class="api-result-text">
                <strong>${pod.collectionName}</strong>
                <div style="color: #64748b; font-size: 0.7rem;">${pod.artistName || 'Ukjent kunstner'}</div>
              </div>
            </div>
            <div style="display: flex; gap: 0.3rem;">
              <button type="button" class="btn-api-select" onclick="fillFormFromApi(${index})">Fyll Ut</button>
              <button type="button" class="btn-api-select" style="background: #3b82f6;" onclick="addToQueue(${index}, this)">+ Kø</button>
            </div>
          `;
          resultsContainer.appendChild(row);
        });
      } catch (err) {
        resultsContainer.innerHTML = '<div style="color: #ef4444; font-size: 0.8rem;">Feil under søk: ' + err.message + '</div>';
      }
    });

    // Fyll ut enkelt-skjema
    window.fillFormFromApi = (index) => {
      const pod = searchResultsCache[index];
      if (!pod) return;

      document.getElementById("item-title").value = pod.collectionName || "";
      document.getElementById("item-sub").value = pod.artistName || pod.primaryGenreName || "";
      document.getElementById("item-cover").value = pod.artworkUrl600 || pod.artworkUrl100 || "";
      document.getElementById("item-rss").value = pod.feedUrl || "";
      document.getElementById("item-desc").value = `Podkast hentet fra Apple. Sjanger: ${pod.primaryGenreName || 'Diverse'}.`;

      const statusMsg = document.getElementById("status-msg");
      statusMsg.innerText = `Skjema fylt ut med "${pod.collectionName}". Velg målseksjon og trykk Publiser!`;
      setTimeout(() => statusMsg.innerText = "", 4000);
    };

    // Legg til i multikø
    window.addToQueue = (index, btnElement) => {
      const pod = searchResultsCache[index];
      if (!pod) return;

      const itemData = {
        title: pod.collectionName || "",
        sub: pod.artistName || pod.primaryGenreName || "",
        coverUrl: pod.artworkUrl600 || pod.artworkUrl100 || "",
        rssUrl: pod.feedUrl || "",
        desc: `Podkast hentet fra Apple. Sjanger: ${pod.primaryGenreName || 'Diverse'}.`
      };

      queueItems.push(itemData);
      btnElement.innerText = "Lagt til!";
      btnElement.disabled = true;
      btnElement.style.background = "#64748b";

      const queueBox = document.getElementById("selected-queue");
      queueBox.classList.remove("hidden");
      document.getElementById("queue-count").innerText = queueItems.length;
    };

    // Publiser alle fra køen
    document.getElementById("batch-publish-btn").addEventListener("click", async () => {
      const sectionId = document.getElementById("item-section-select").value;
      if (!sectionId) return alert("Du må velge en Målseksjon i skjemaet under før du publiserer køen!");

      try {
        const sectionRef = doc(db, "sections", sectionId);
        const docSnap = await getDoc(sectionRef);
        
        if (docSnap.exists()) {
          const currentItems = docSnap.data().items || [];
          const updatedItems = [...currentItems, ...queueItems];
          
          await updateDoc(sectionRef, { items: updatedItems });
          
          alert(`${queueItems.length} elementer ble vellykket lagt til i seksjonen!`);
          
          // Nullstill kø
          queueItems = [];
          document.getElementById("selected-queue").classList.add("hidden");
          document.getElementById("queue-count").innerText = "0";
        }
      } catch (err) {
        alert("Feil under publisering av kø: " + err.message);
      }
    });

    // Last inn Firestore-data i sanntid
    function loadDatabaseContent() {
      const sectionsSelect = document.getElementById("item-section-select");
      const sectionsList = document.getElementById("sections-list");

      const q = query(collection(db, "sections"), orderBy("order", "asc"));
      onSnapshot(q, (snapshot) => {
        sectionsSelect.innerHTML = '<option value="">-- Velg Seksjon --</option>';
        sectionsList.innerHTML = '';

        if (snapshot.empty) {
          sectionsList.innerHTML = '<p style="color: #64748b; text-align: center; padding: 2rem;">Ingen seksjoner funnet. Opprett en ovenfor.</p>';
        }

        snapshot.forEach((docSnap) => {
          const sec = docSnap.data();
          const id = docSnap.id;
          const pages = Array.isArray(sec.pages) ? sec.pages : [sec.page || 'home'];

          // Oppdater nedtrekksmeny
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = `[${pages.join(", ").toUpperCase()}] ${sec.title}`;
          sectionsSelect.appendChild(opt);

          // Bygg oversiktskort
          const secCard = document.createElement("div");
          secCard.className = "section-card";

          let itemsHtml = "";
          if (sec.items && sec.items.length > 0) {
            itemsHtml = sec.items.map((item, index) => `
              <div class="item-row">
                <div class="item-info">
                  ${item.coverUrl ? `<img src="${item.coverUrl}" class="item-thumbnail" alt="Cover">` : `<div class="item-thumbnail"></div>`}
                  <div>
                    <strong>${item.title}</strong>
                    <div style="color: #64748b; font-size: 0.75rem;">${item.sub}</div>
                  </div>
                </div>
                <button class="btn-delete" onclick="deleteItem('${id}', ${index})">Slett</button>
              </div>
            `).join("");
          } else {
            itemsHtml = `<div style="color: #475569; font-size: 0.8rem; padding: 0.5rem 0;">Ingen elementer i denne seksjonen ennå.</div>`;
          }

          const badgesHtml = pages.map(p => `<span class="badge">${p}</span>`).join("");

          secCard.innerHTML = `
            <div class="section-header">
              <div>
                ${badgesHtml}
                <strong style="margin-left: 0.5rem; font-size: 1rem;">${sec.title}</strong>
                <span style="color: #64748b; font-size: 0.8rem; margin-left: 0.5rem;">(Rekkefølge: ${sec.order})</span>
              </div>
              <button class="btn-delete" onclick="deleteSection('${id}')">Slett Seksjon</button>
            </div>
            ${itemsHtml}
          `;
          sectionsList.appendChild(secCard);
        });
      });
    }

    // Opprett Seksjon
    document.getElementById("add-section-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("sec-title").value;
      const order = parseInt(document.getElementById("sec-order").value);
      const selectedPages = Array.from(document.querySelectorAll('.sec-target-pages:checked')).map(cb => cb.value);

      if (selectedPages.length === 0) return alert("Velg minst én side hvor seksjonen skal vises.");

      try {
        await addDoc(collection(db, "sections"), { title, pages: selectedPages, order, items: [] });
        document.getElementById("sec-title").value = '';
      } catch (err) {
        alert("Feil under opprettelse: " + err.message);
      }
    });

    // Legg til enkelt-innhold
    document.getElementById("add-item-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sectionId = document.getElementById("item-section-select").value;
      const statusMsg = document.getElementById("status-msg");

      if (!sectionId) return alert("Velg en målseksjon først!");

      statusMsg.innerText = "Lagrer innhold...";

      try {
        const title = document.getElementById("item-title").value;
        const sub = document.getElementById("item-sub").value;
        const coverUrl = document.getElementById("item-cover").value;
        const rssUrl = document.getElementById("item-rss").value;
        const desc = document.getElementById("item-desc").value;

        const sectionRef = doc(db, "sections", sectionId);
        const docSnap = await getDoc(sectionRef);

        if (docSnap.exists()) {
          const currentItems = docSnap.data().items || [];
          const newItem = { title, sub, coverUrl: coverUrl || "", rssUrl: rssUrl || "", desc };
          
          await updateDoc(sectionRef, {
            items: [...currentItems, newItem]
          });

          statusMsg.innerText = "Publisert med suksess!";
          document.getElementById("add-item-form").reset();
          document.getElementById("api-results").innerHTML = "";
        }
      } catch (err) {
        statusMsg.innerText = "Feil ved lagring: " + err.message;
      } finally {
        setTimeout(() => statusMsg.innerText = "", 3000);
      }
    });

    // Slett seksjon
    window.deleteSection = async (id) => {
      if (confirm("Er du sikker på at du vil slette hele denne seksjonen og alt innholdet i den?")) {
        await deleteDoc(doc(db, "sections", id));
      }
    };

    // Slett enkelt-element fra seksjon
    window.deleteItem = async (sectionId, itemIndex) => {
      if (confirm("Vil du slette dette elementet?")) {
        const sectionRef = doc(db, "sections", sectionId);
        const docSnap = await getDoc(sectionRef);
        if (docSnap.exists()) {
          const currentItems = docSnap.data().items || [];
          currentItems.splice(itemIndex, 1);
          await updateDoc(sectionRef, { items: currentItems });
        }
      }
    };
  </script>
</body>
</html>
