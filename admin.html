<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tale – Admin Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { display: flex; background: #070b1e; color: white; height: 100vh; overflow: hidden; }
    
    /* Venstre side: Kontrollpanel */
    .admin-controls { width: 50%; padding: 2rem; overflow-y: auto; border-right: 2px solid #1e293b; }
    h1 { margin-bottom: 1rem; color: #AEC2F7; }
    .card { background: #0b112c; padding: 1.5rem; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 1.5rem; }
    input, select, textarea { width: 100%; padding: 0.8rem; margin: 0.4rem 0 1rem 0; background: #070b1e; border: 1px solid #1e293b; color: white; border-radius: 6px; }
    button { background: #AEC2F7; color: #0b112c; padding: 0.8rem 1.2rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-delete { background: #ef4444; color: white; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    
    .section-list-item { display: flex; justify-content: space-between; align-items: center; background: #131b3e; padding: 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; }

    /* Høyre side: Mobil Live Preview */
    .preview-container { width: 50%; display: flex; justify-content: center; align-items: center; background: #03050f; position: relative; }
    .phone-mockup { width: 380px; height: 750px; border: 12px solid #1e293b; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); background: #070b1e; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- VENTSRE: KONTROLLPANEL -->
  <div class="admin-controls">
    <h1>Tale CMS Studio</h1>

    <!-- Opprett ny Seksjon -->
    <div class="card">
      <h3>Legg til ny Seksjon / Karusell</h3>
      <form id="add-section-form">
        <label>Seksjonsnavn</label>
        <input type="text" id="sec-title" placeholder="f.eks. Topp 10 Lydbøker" required>
        
        <label>Plasser på side</label>
        <select id="sec-page">
          <option value="home">Hjem</option>
          <option value="audiobooks">Lydbøker</option>
          <option value="podcasts">Podkaster</option>
          <option value="radio">Radio</option>
        </select>

        <label>Rekkefølge (Tall)</label>
        <input type="number" id="sec-order" value="1" required>

        <button type="submit">Opprett Seksjon</button>
      </form>
    </div>

    <!-- Legg til Innhold i Seksjon -->
    <div class="card">
      <h3>Legg til Lydbok / Podkast i Seksjon</h3>
      <form id="add-item-form">
        <label>Velg Seksjon</label>
        <select id="item-section-select" required></select>

        <label>Tittel</label>
        <input type="text" id="item-title" placeholder="Tittel" required>

        <label>Undertittel / Kategori</label>
        <input type="text" id="item-sub" placeholder="f.eks. Krim / NRK" required>

        <label>Emoji / Ikon Cover</label>
        <input type="text" id="item-icon" placeholder="📖, 🎙️ eller 📻" value="📖" required>

        <label>Beskrivelse</label>
        <textarea id="item-desc" placeholder="Kort om innholdet..." rows="3"></textarea>

        <button type="submit">Legg til Innhold</button>
      </form>
    </div>

    <!-- Liste over eksisterende seksjoner -->
    <div class="card">
      <h3>Eksisterende Seksjoner</h3>
      <div id="sections-list">Laster inn seksjoner...</div>
    </div>
  </div>

  <!-- HØYRE: LIVE MOBIL PREVIEW -->
  <div class="preview-container">
    <div class="phone-mockup">
      <iframe src="index.html"></iframe>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
