name: Bygg App-fil

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v3

      - name: Sett opp Java (kreves for å bygge APK)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sett opp Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Lag dummy APK for testing
        run: |
          echo "Klar til å bygge"
          # Vi lager en enkel oversikt for å sjekke verktøyene
          bubblewrap --version
